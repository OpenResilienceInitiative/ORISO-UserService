agency.service.api.url=${AGENCY_SERVICE_API_URL:http://localhost:8085/service}
agency.admin.service.api.url=${AGENCY_ADMIN_SERVICE_API_URL:http://localhost:8085}

# ---------------- CSRF (match admin app) ----------------
