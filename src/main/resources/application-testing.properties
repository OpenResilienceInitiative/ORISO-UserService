# ---------------- Logging ----------------
server.port=8082
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=ERROR
logging.level.org.springframework.web.servlet.mvc.method.annotation=DEBUG
# Keep RestTemplate at INFO: its DEBUG body logging prints outbound request
# payloads (e.g. Matrix service-account passwords) in clear text.
logging.level.org.springframework.web.client.RestTemplate=INFO

# ---------------- Keycloak ----------------
keycloak.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080/auth}
keycloak.realm=${KEYCLOAK_REALM:testing}
keycloak.bearer-only=true
keycloak.resource=app
keycloak.principal-attribute=preferred_username
keycloak.cors=false
keycloak.use-resource-role-mappings=false
keycloak.config.admin-client-id=${KEYCLOAK_CONFIG_ADMIN_CLIENTID:backend-admin}
keycloak.config.app-client-id=app

# ---------------- Identity Management ----------------
# No credential defaults live in this file. It is packaged into UserService.jar, so anything set
# here is available to every run of the testing profile, including the packaged jar started with
# SPRING_PROFILES_ACTIVE=testing. CounsellorInviteProvisioningService logs in with the technical
# user, so a well-known fallback would let a shared environment authenticate with published
# credentials. Leaving them unset makes ConfigurationValidator fail startup instead.
#
# The dummy values used by the test suite live in src/test/resources and are imported below; that
# file is on the test classpath only, so the import is a no-op for the packaged jar.
spring.config.import=optional:classpath:application-testing-credentials.properties
identity.openid-connect-url=http://localhost:8080/auth/realms/testing/.well-known/openid-configuration

# ---------------- Test Database ----------------
# Scaled for 5000 concurrent users
# Configuration must be provided via ConfigMap/Secrets (environment variables)
# Use Kubernetes DNS names, e.g., jdbc:mariadb://mariadb.caritas.svc.cluster.local:3306/userservice
# NOT hardcoded IPs like jdbc:mariadb://10.43.123.72:3306/userservice
# Every distinct Spring test context owns its database. A shared named H2 database lets an evicted
# create-drop context remove the schema underneath another cached context on clean CI runners.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:userservice-testing-${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MariaDB;NON_KEYWORDS=USER,VALUE,DAY}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:test}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.maxLifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# The seed script ships in src/test/resources, so it is only on the classpath under the test
# runtime. The optional: prefix keeps the app bootable when the testing profile is used outside
# it (e.g. a local jar run) instead of failing startup on the missing resource.
spring.sql.init.data-locations=optional:classpath:database/UserServiceDatabase.sql,optional:classpath:database/AccountInactivityDatabase.sql

# ---------------- Liquibase ----------------
spring.liquibase.enabled=false
# Database already exists, skip Liquibase migration

# ---------------- Local App Settings ----------------
# Public mail-link origins. Deployed profiles require these with no default (ORISO-Helm#368);
# the testing profile pins them to this service's own local port.
app.base.url=${APP_BASE_URL:http://localhost:8082}
system.notification.frontend.base-url=${SYSTEM_NOTIFICATION_FRONTEND_BASE_URL:http://localhost:8082}
dpa.sign.frontend.base-url=${DPA_SIGN_FRONTEND_BASE_URL:http://localhost:8082}
magic.link.frontend.base-url=${MAGIC_LINK_FRONTEND_BASE_URL:http://localhost:8082}
account.invite.app.frontend.base-url=${ACCOUNT_INVITE_APP_FRONTEND_BASE_URL:http://localhost:8082}
account.invite.admin.frontend.base-url=${ACCOUNT_INVITE_ADMIN_FRONTEND_BASE_URL:http://localhost:8082}
multitenancy.enabled=false
# ADR-008 draft: keep the assigned-only authority restriction OFF in tests (draft default).
supervision.restrict-add-to-assigned-consultant=false
appointments.delete-job-enabled=true
appointments.lifespan-in-hours=3

# ---------------- Agency Service URL ----------------
# Placeholder hosts, like the tenant/consulting-type entries above: the agency
