<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">
<title>{{SUBJECT}}</title>
<!--[if mso]><style>body,table,td,a{font-family:Arial,Helvetica,sans-serif !important}</style><![endif]-->
<style>
  img{border:0;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic;max-width:100%}table{border-collapse:collapse}a[x-apple-data-detectors]{color:inherit !important;text-decoration:none !important;font-size:inherit !important;font-family:inherit !important;font-weight:inherit !important;line-height:inherit !important}
  @media only screen and (max-width:620px){.wrap{width:100% !important;max-width:100% !important}.edge{padding:24px 8px 32px 8px !important}.sp{padding-left:24px !important;padding-right:24px !important}.h1{font-size:22px !important;line-height:30px !important}.btn table{width:100% !important}.btn td{width:100% !important}.btn a{display:block !important;padding-left:20px !important;padding-right:20px !important;text-align:center !important}}
</style>
</head>
<body bgcolor="#f2efef" style="margin:0;padding:0;width:100%;background-color:#f2efef;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
<span style="display:none !important;visibility:hidden;opacity:0;height:0;width:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:#f2efef;">{{PREHEADER}}</span>
<!-- Frame tokens follow emails/*/einladung-fachkraft.html; parity is pinned by renderer tests. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f2efef" style="background-color:#f2efef;"><tr><td class="edge" align="center" style="padding:32px 12px 48px 12px;">
<table role="presentation" class="wrap" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;">
<tr><td class="sp oriso-invitation-header" style="padding:0px 40px 20px 40px;"><table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>{{LOGO_CELL}}<td valign="middle" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:16px;line-height:24px;font-weight:600;letter-spacing:0.15px;color:#1d1b1b;">{{BRAND_NAME}}</td></tr></table></td></tr>
<tr><td style="padding:0;"><table role="presentation" class="oriso-invitation-card" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:separate;background-color:#ffffff;border-radius:24px;border:1px solid #e0dada;">
<tr><td class="sp" style="padding:36px 40px 0px 40px;"><table role="presentation" cellpadding="0" cellspacing="0" border="0" width="44" style="width:44px;"><tr><td height="4" bgcolor="{{ACCENT_COLOR}}" style="height:4px;line-height:4px;font-size:0;border-radius:999px;background-color:{{ACCENT_COLOR}};">&nbsp;</td></tr></table></td></tr>
<tr><td class="sp" style="padding:18px 40px 14px 40px;"><h1 class="h1" style="margin:0;font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:24px;line-height:32px;font-weight:500;color:#1d1b1b;mso-line-height-rule:exactly;">{{SUBJECT}}</h1></td></tr>
<tr><td class="sp" style="padding:0px 40px 28px 40px;font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:16px;line-height:26px;color:#1d1b1b;mso-line-height-rule:exactly;">{{CONTENT}}</td></tr>
{{CTA}}
</table></td></tr>
<tr><td class="sp oriso-invitation-footer" style="padding:28px 40px 0px 40px;font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;line-height:18px;color:#5c5555;word-break:break-word;">
<div style="color:#1d1b1b;font-weight:600;font-size:13px;line-height:20px;">{{BRAND_NAME}}</div>
<div style="padding-top:14px;">{{FOOTER_LINKS}}</div>
<div style="padding-top:14px;color:#8a8080;">{{FOOTER_NOTE}}</div>
</td></tr></table></td></tr></table>
</body>
</html>
