csrf.whitelist.header.property=X-CSRF-Bypass

# ---------------- RabbitMQ ----------------
# Use Kubernetes DNS names, e.g., rabbitmq.caritas.svc.cluster.local
# NOT hardcoded IPs like 10.43.157.60
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:}
statistics.enabled=false
statistics.rabbitmq.exchange.name=statistics.topic
# Small-cell suppression for the admin statistics dashboard (KDG re-identification
# protection). May only be disabled in non-production environments for E2E testing;
# the prod profile enforces suppression regardless of this value (fail-closed).
statistics.small-cell-suppression.enabled=${STATISTICS_SMALL_CELL_SUPPRESSION_ENABLED:true}

# ---------------- Video Chat ----------------
videochat.e2e-encryption-enabled=false

# ---------------- MariaDB ----------------
# Configuration must be provided via ConfigMap/Secrets (environment variables)
# Use Kubernetes DNS names, e.g., jdbc:mariadb://mariadb.caritas.svc.cluster.local:3306/userservice
# NOT hardcoded IPs like jdbc:mariadb://10.43.123.72:3306/userservice
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=80
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.maxLifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=validate

# ---------------- Keycloak ----------------
# Use Kubernetes DNS names, e.g., http://keycloak.caritas.svc.cluster.local:8080
# NOT hardcoded IPs like http://10.43.63.186:8080
keycloak.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:}
keycloak.realm=${KEYCLOAK_REALM:}
keycloak.bearer-only=true
keycloak.resource=app
keycloak.principal-attribute=preferred_username
keycloak.cors=false

# ---------------- Multitenancy ----------------
multitenancy.enabled=false
spring.jpa.properties.hibernate.ejb.interceptor=de.caritas.cob.userservice.api.service.TenantHibernateInterceptor
hibernate.current_session_context_class=org.hibernate.context.internal.ThreadLocalSessionContext

# ---------------- Appointments & Features ----------------
appointments.delete-job-cron=0 0 0 * * ?
appointments.delete-job-enabled=false
appointments.lifespan-in-hours=24
feature.topics.enabled=false
feature.demographics.enabled=false
feature.appointment.enabled=false
feature.multitenancy.with.single.domain.enabled=false
feature.video.group.chats.enabled=true

# ---------------- Supervision (ADR-008) ----------------
# ADR-008 item 4 (DRAFT): when true, only the ASSIGNED consultant of a session may add supervisors
# (the ADR-008 target). Defaults false → keeps the current behaviour (assigned OR same agency), so
# flipping this on is the only runtime change; the draft is inert until then.
supervision.restrict-add-to-assigned-consultant=${SUPERVISION_RESTRICT_ADD_TO_ASSIGNED:false}

# ---------------- Actuator ----------------
management.endpoint.health.enabled=true
management.endpoint.health.show-details=when-authorized
management.endpoints.web.exposure.include=health,loggers
management.endpoint.health.probes.enabled=true
management.endpoint.loggers.enabled=true

# ---------------- OpenTelemetry / SigNoz (traces + metrics) ----------------
# Traces and metrics ship via OTLP to the SigNoz gateway collector (logs already
# flow separately via stdout JSON). Endpoints are env-driven, each with its own
# explicit *_ENABLED flag (see below).
#
# Property names verified against the actual Spring Boot 4.0.1 tagged source /
# spring-configuration-metadata.json (not docs): Boot 4 renamed the tracing OTLP
# property from the Boot-3-era management.otlp.tracing.endpoint (deprecated,
# level=error, since=4.0.0 -> unrecognized/inert in 4.0.1) to
# management.opentelemetry.tracing.export.otlp.endpoint. The metrics-side
# management.otlp.metrics.export.url was NOT renamed and is still correct.
#
# Both the tracing OTLP connection-details bean and the metrics OtlpMeterRegistry
# treat "endpoint/url property is present" (ANY value, including empty string) as
# "on" - an empty-string endpoint alone is NOT a safe no-op. Each side therefore
# also gets its own explicit enabled flag, defaulting to false, so nothing tries
# to export until ORISO-Helm flips both the endpoint and the *_ENABLED env var.
management.opentelemetry.tracing.export.otlp.endpoint=${MANAGEMENT_OTLP_TRACING_ENDPOINT:}
management.tracing.export.otlp.enabled=${MANAGEMENT_OTLP_TRACING_ENABLED:false}
management.otlp.metrics.export.url=${MANAGEMENT_OTLP_METRICS_EXPORT_URL:}
management.otlp.metrics.export.enabled=${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:false}

# ---------------- Local Defaults ----------------
anonymous.username.prefix=anon_
registration.agency-fallback.consulting-type-id=${REGISTRATION_AGENCY_FALLBACK_CONSULTING_TYPE_ID:}

# Matrix Synapse Configuration
# Use Kubernetes DNS names, e.g., http://matrix-synapse.caritas.svc.cluster.local:8008
# NOT hardcoded IPs like http://91.99.219.182:8008
matrix.apiUrl=${MATRIX_API_URL:}
matrix.registrationSharedSecret=${MATRIX_REGISTRATION_SHARED_SECRET:}
matrix.serverName=${MATRIX_SERVER_NAME:}
matrix.adminUsername=${MATRIX_ADMIN_USERNAME:}
matrix.adminPassword=${MATRIX_ADMIN_PASSWORD:}
# Derive consultant live-chat availability from real-time Matrix presence.
# Set to false to fall back to the legacy RocketChat / best-effort signal.
matrix.presenceEnabled=${MATRIX_PRESENCE_ENABLED:true}
matrix.encryptionEnabled=${MATRIX_ENCRYPTION_ENABLED:false}
# A consultant counts as available only if their last Matrix activity is within this window (ms).
# Avoids counting consultants who closed the app but linger as "online"/"unavailable" in Synapse.
matrix.presenceActiveThresholdMs=${MATRIX_PRESENCE_ACTIVE_THRESHOLD_MS:300000}

# Live-chat availability: a consultant counts as available when they made an authenticated request
# within this window (ms). The consultant app polls UserService while open, so this reflects who is
# actually reachable to take a new anonymous enquiry. Default 2 minutes.
consultant.availability.activeWindowMs=${CONSULTANT_AVAILABILITY_ACTIVE_WINDOW_MS:120000}

# Debug-only Redis message mirror (disabled by default).
debug.redis.message.mirror.enabled=${DEBUG_REDIS_MESSAGE_MIRROR_ENABLED:false}
debug.redis.message.mirror.ttlSeconds=${DEBUG_REDIS_MESSAGE_MIRROR_TTL_SECONDS:900}
debug.redis.message.mirror.maxBodyLength=${DEBUG_REDIS_MESSAGE_MIRROR_MAX_BODY_LENGTH:500}
debug.redis.message.mirror.keyPrefix=${DEBUG_REDIS_MESSAGE_MIRROR_KEY_PREFIX:debug:msgmirror}

# Notification preview policy: NONE (default), MASKED, FULL
privacy.notificationPreviewMode=${PRIVACY_NOTIFICATION_PREVIEW_MODE:NONE}
# IP privacy mode: STANDARD (default) or STRICT
privacy.ipMode=${PRIVACY_IP_MODE:STANDARD}

# US#473 Team-Besprechung (ADR-016). Deploy-level gate; tenant-level flag is a follow-up.
team-discussion.enabled=true
