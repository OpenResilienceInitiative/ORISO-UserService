# ical4j reads this file from the classpath (calendar busy import, ADR-032, ORISO-UserService#1645).
# Never fetch time zone definitions over the network: an imported calendar names the address
# (TZURL), so an update would let its author make this service call any host.
net.fortuna.ical4j.timezone.update.enabled=false
net.fortuna.ical4j.timezone.cache.impl=net.fortuna.ical4j.util.MapTimeZoneCache
# Calendars in the wild are not strict RFC 5545.
ical4j.parsing.relaxed=true
ical4j.unfolding.relaxed=true
ical4j.validation.relaxed=true
ical4j.compatibility.outlook=true
