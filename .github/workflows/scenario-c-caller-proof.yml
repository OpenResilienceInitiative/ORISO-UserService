vice.api.adapters.web.controller.ManagedAccountStatusControllerTest': 18, 'de.caritas.cob.userservice.api.adapters.keycloak.lifecycle.MaintenanceNoEffectCodecTest': 4, 'de.caritas.cob.userservice.api.admin.service.consultant.update.ConsultantUpdateServiceTest': 22, 'de.caritas.cob.userservice.api.adapters.keycloak.lifecycle.ClaimedPasswordIntentCodecTest': 3, 'de.caritas.cob.userservice.api.adapters.keycloak.lifecycle.ClaimedPasswordRequestDigestsTest': 6, 'de.caritas.cob.userservice.api.service.auth.PasswordResetServiceTest': 30, 'de.caritas.cob.userservice.api.service.auth.RedisPasswordResetCustodyIT': 12, 'de.caritas.cob.userservice.api.adapters.persistence.password.JdbcExistingSetupPasswordClaimsTest': 7, 'de.caritas.cob.userservice.api.service.accountinvite.ExistingAccountSetupCausalClaimsTest': 4, 'de.caritas.cob.userservice.api.adapters.web.controller.UserSelfPasswordScenarioCBoundaryTest': 8, 'de.caritas.cob.userservice.api.adapters.web.controller.UserSelfLocaleScenarioCBoundaryTest': 11, 'de.caritas.cob.userservice.api.adapters.keycloak.maintenance.SelfLocaleMaintenanceJpaTest': 11, 'de.caritas.cob.userservice.api.adapters.keycloak.lifecycle.ReviewedMaintenanceProfilesTest': 7, 'de.caritas.cob.userservice.api.config.CustomWebMvcConfigurerTest': 3, 'de.caritas.cob.userservice.api.service.auth.ClaimedPasswordMaintenanceFlowIT': 26, 'de.caritas.cob.userservice.api.workflow.accountinactivity.AccountInactivityServiceTest': 28, 'de.caritas.cob.userservice.api.workflow.accountinactivity.ScopedInactivityNativeBoundaryTest': 8, 'de.caritas.cob.userservice.api.adapters.keycloak.lifecycle.ClaimedInactivityRowCodecTest': 4, 'de.caritas.cob.userservice.api.adapters.keycloak.lifecycle.ExistingConsultantImportCodecTest': 2, 'de.caritas.cob.userservice.api.adapters.keycloak.lifecycle.AccountLifecycleRetrySchedulerTest': 4, 'de.caritas.cob.userservice.api.adapters.keycloak.maintenance.SelfLocaleOwnedAccountsIT': 10, 'de.caritas.cob.userservice.api.adapters.keycloak.lifecycle.ProfileTransitionCodecTest': 3, 'de.caritas.cob.userservice.api.adapters.keycloak.lifecycle.ReactivationIntentCodecTest': 2, 'de.caritas.cob.userservice.api.config.auth.ConsultantImportTriggerBoundaryTest': 2, 'de.caritas.cob.userservice.api.adapters.web.controller.ConsultantImportTriggerHttpTest': 3, 'de.caritas.cob.userservice.api.adapters.keycloak.lifecycle.ClaimedScheduledDeletionIntentCodecTest': 4, 'de.caritas.cob.userservice.api.workflow.delete.service.ScheduledDeletionContinuationJpaTest': 34, 'de.caritas.cob.userservice.api.workflow.delete.service.InactivityDeletionContinuationJpaTest': 20, 'de.caritas.cob.userservice.api.admin.service.ScopedAskerReactivationJpaTest': 1}

          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()

          def snapshot():
              paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
              values = {}
              for p in sorted(p for p in paths if p):
                  path = root / p
                  data = b'symlink\0' + os.readlink(path).encode() if path.is_symlink() else path.read_bytes()
                  values[p] = hashlib.sha256(data).hexdigest()
              return values

          inputs = snapshot()
          (proof / 'source-before.json').write_text(json.dumps(inputs, indent=2) + '\n')
          (proof / 'checkout.json').write_text(json.dumps({
              'commit': git('rev-parse', 'HEAD'), 'parents': git('show', '-s', '--format=%P', 'HEAD'),
              'devBase': os.environ['SCENARIO_C_DEV_BASE'], 'expectedSuites': floors,
              'local281ProofIsHostedProof': False,
          }, indent=2) + '\n')
          subprocess.run(['git', 'merge-base', '--is-ancestor', os.environ['SCENARIO_C_DEV_BASE'], 'HEAD'], check=True)
          wrapper = (root / '.mvn/wrapper/maven-wrapper.properties').read_text()
          expected_url = 'https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.15/apache-maven-3.9.15-bin.zip'
          assert ('distributionUrl=' + expected_url) in wrapper.splitlines(), 'Unexpected Maven wrapper distribution'
          changed = subprocess.check_output(['git', 'diff', '--name-only', os.environ['SCENARIO_C_DEV_BASE'], 'HEAD', '--', '*.java']).decode().splitlines()
          scoped = [str(root / p) for p in sorted(changed) if (root / p).is_file()]
          assert scoped, 'Missing scoped Java formatting inventory'
          (proof / 'spotless-scope.json').write_text(json.dumps(scoped, indent=2) + '\n')
          common = ['./mvnw', '-B', '-ntp', '-Dmaven.wagon.http.retryHandler.count=3',
                    '-DspotlessFiles=' + '|'.join(re.escape(p) for p in scoped)]

          def execute(argv, log, seconds):
              with log.open('w') as output:
                  child = subprocess.Popen(argv, stdout=output, stderr=subprocess.STDOUT, start_new_session=True)
                  try:
                      return child.wait(timeout=seconds)
                  except subprocess.TimeoutExpired:
                      os.killpg(child.pid, signal.SIGTERM)
                      try:
                          child.wait(timeout=10)
                      except subprocess.TimeoutExpired:
                          os.killpg(child.pid, signal.SIGKILL)
                          child.wait()
                      return 124

          # Only the tool bootstrap may retry. Product test failures are never retried or suppressed.
          for attempt in range(1, 4):
              status = execute(['./mvnw', '--version'], proof / f'toolchain-{attempt}.log', 120)
              if status == 0:
                  break
          if status:
              raise SystemExit(status)
          version = (proof / f'toolchain-{attempt}.log').read_text()
          assert 'Apache Maven 3.9.15' in version, 'Wrong Maven runtime'
          assert 'Java version: 21.0.12' in version, 'Wrong Java runtime'

          def inventory(phase, status):
              reports = root / 'target/surefire-reports'
              destination = proof / phase / 'surefire-reports'
              destination.parent.mkdir(parents=True, exist_ok=True)
              if reports.exists():
                  shutil.move(str(reports), str(destination))
              suites, cases = {}, []
              for report in sorted(destination.glob('TEST-*.xml')):
                  suite = ET.parse(report).getroot()
                  name = suite.attrib['name']
                  assert name not in suites, 'Duplicate suite report'
                  suites[name] = {key: int(suite.get(key, '0')) for key in ('tests', 'failures', 'errors', 'skipped')}
                  observed = suite.findall('testcase')
                  assert len(observed) == suites[name]['tests'], 'Incomplete testcase XML inventory'
                  assert sum(len(case.findall('skipped')) for case in observed) == suites[name]['skipped'], 'Inconsistent skip inventory'
                  cases.extend(observed)
              totals = {key: sum(s[key] for s in suites.values()) for key in ('tests', 'failures', 'errors', 'skipped')}
              result = {'phase': phase, 'mavenExit': status, 'freshReports': True, 'suites': suites, 'totals': totals}
              if phase == 'regression':
                  exact = len(cases) == 1 and cases[0].get('classname') == target_class and cases[0].get('name') == target_method
                  failures = cases[0].findall('failure') if exact else []
                  detail = '\n'.join((f.get('message', '') + '\n' + (f.text or '')) for f in failures)
                  encoding_red = (exact and status == 1 and totals == {'tests': 1, 'failures': 1, 'errors': 0, 'skipped': 0}
                                  and expected_encoding in detail and 'agency-admin+demo' in detail)
                  result['classification'] = 'PUBLIC_SERVICE_ENCODING_ASSERTION_RED' if encoding_red else 'PASS' if exact and status == 0 and totals == {'tests': 1, 'failures': 0, 'errors': 0, 'skipped': 0} else 'INCONCLUSIVE_OR_OTHER_FAILURE'
                  valid = exact and status == 0 and totals == {'tests': 1, 'failures': 0, 'errors': 0, 'skipped': 0}
              else:
                  valid = (status == 0 and totals['tests'] >= 282 and len(suites) >= 23
                           and totals['failures'] == totals['errors'] == totals['skipped'] == 0
                           and all(suites.get(name, {}).get('tests', 0) >= floor for name, floor in floors.items()))
              if phase != 'regression':
                  result['classification'] = 'PASS' if valid else 'INCOMPLETE_OR_FAILED'
              result['acceptedGreen'] = valid
              (proof / phase / 'inventory.json').write_text(json.dumps(result, indent=2) + '\n')
              print(json.dumps({'phase': phase, 'classification': result['classification'], 'totals': totals, 'acceptedGreen': valid}))
              return valid

          def test_phase(phase, selector, seconds):
              assert not (root / 'target/surefire-reports').exists(), 'Stale test report directory'
              selected = selector.split(',')
              assert len(selected) == len(set(selected)), 'Duplicate selected test class'
              batches = [selected] if phase != 'focused' else [selected[n::3] for n in range(3) if selected[n::3]]
              merged = proof / 'focused-merged-reports'
              if phase == 'focused':
                  merged.mkdir()
              statuses = []
              for index, batch in enumerate(batches):
                  argv = [*common, 'test', '-Dtest=' + ','.join(batch)]
                  label = phase
                  if phase == 'focused':
                      # Fresh classloaders and disjoint bounded batches; no product-test retry.
                      argv += ['-DforkCount=1', '-DreuseForks=false']
                      label += '-batch-' + str(index)
                  (proof / (label + '-command.json')).write_text(json.dumps(argv, indent=2) + '\n')
                  status = execute(argv, proof / (label + '.log'), seconds)
                  statuses.append({'classes': batch, 'exitCode': status, 'limitSeconds': seconds})
                  assert snapshot() == inputs, 'Source or resource changed during Maven'
                  if phase == 'focused':
                      reports = root / 'target/surefire-reports'
                      if reports.exists():
                          destination = proof / label / 'surefire-reports'
                          destination.parent.mkdir(parents=True)
                          shutil.move(str(reports), str(destination))
                          for report in destination.glob('TEST-*.xml'):
                              assert not (merged / report.name).exists(), 'Duplicate test suite across batches'
                              shutil.copy2(report, merged / report.name)
              status = next((item['exitCode'] for item in statuses if item['exitCode']), 0)
              (proof / (phase + '-executions.json')).write_text(json.dumps(statuses, indent=2) + '\n')
              if phase == 'focused':
                  shutil.move(str(merged), str(root / 'target/surefire-reports'))
              valid = inventory(phase, status)
              assert snapshot() == inputs, 'Source or resource changed during Maven'
              if status or not valid:
                  # Every batch remains in the aggregate; a later pass cannot hide an earlier failure.
                  raise SystemExit(status or 1)

          # Reject formatting input before compiling and running the full product proof.
          format_status = execute([*common, 'spotless:check'], proof / 'format-check.log', 300)
          (proof / 'format-check.json').write_text(json.dumps({
              'exitCode': format_status, 'productTestsRun': False, 'limitSeconds': 300,
          }, indent=2) + '\n')
          assert snapshot() == inputs, 'Source or resource changed during formatting check'
          if format_status:
              raise SystemExit(format_status)
          test_phase('regression', target_class + '#' + target_method, 600)
          selectors = ','.join(floors)
          test_phase('focused', selectors, 600)
          argv = [*common, 'package', '-Dskip.unit-tests=true', '-Dskip.integration-tests=true', '-DskipTests']
          (proof / 'package-command.json').write_text(json.dumps(argv, indent=2) + '\n')
          status = execute(argv, proof / 'package.log', 300)
          jars = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted((root / 'target').glob('*.jar'))}
          (proof / 'package.json').write_text(json.dumps({'exit': status, 'jars': jars, 'usesVerifiedFocusedTests': True}, indent=2) + '\n')
          assert snapshot() == inputs, 'Source or resource changed while packaging'
          if status or not jars:
              raise SystemExit(status or 1)
          PY
      - name: Preserve source stability and interrupted reports
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          root = pathlib.Path.cwd()
          proof = root / 'target/scenario-c-caller-proof'
          proof.mkdir(parents=True, exist_ok=True)
          reports = root / 'target/surefire-reports'
          if reports.exists():
              shutil.move(str(reports), str(proof / 'interrupted-surefire-reports'))
          names = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          after = {}
          for p in sorted(p for p in names if p):
              path = root / p
              data = b'symlink\0' + os.readlink(path).encode() if path.is_symlink() else path.read_bytes()
              after[p] = hashlib.sha256(data).hexdigest()
          (proof / 'source-after.json').write_text(json.dumps(after, indent=2) + '\n')
          before = proof / 'source-before.json'
          stable = before.exists() and json.loads(before.read_text()) == after
          (proof / 'source-stability.json').write_text(json.dumps({'stable': stable}, indent=2) + '\n')
          if not stable:
              raise SystemExit('Missing or changed full source/resource manifest')
          PY
