name: Scenario C caller proof

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, codex/367-c-caller-finish-20261021, codex/367-c-maintenance-user-20261021, codex/367-c-reactivation-finish-20261023]

permissions:
  contents: read

concurrency:
  group: caller-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  caller-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SCENARIO_C_DEV_BASE: c944417d9d664d35d63b31bb57c55f852c2d783c
      MAVEN_OPTS: -Xmx1024m -XX:ActiveProcessorCount=2
      JAVA_TOOL_OPTIONS: -Xmx512m -XX:MaxMetaspaceSize=192m -XX:ActiveProcessorCount=2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'
          cache: maven
          cache-dependency-path: |
            pom.xml
            .mvn/wrapper/maven-wrapper.properties
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12.13
      - name: Prove the admin encoding regression before focused tests and package
        shell: bash
        run: |
