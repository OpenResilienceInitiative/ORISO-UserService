name: UserService Build and Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - pre-dev

env:
  REGISTRY: ghcr.io
  ORG: openresilienceinitiative

jobs:
  required-integration-tests:
    name: required integration tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Run deterministic integration contract
      uses: ./.github/actions/maven-verify-required
      with:
        java_version: '21'

  publish:
    name: test, build and publish image
    needs: required-integration-tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Run UserService tests and build
      uses: ./.github/actions/maven-build
      with:
        java_version: '21'

    - name: Publish UserService Docker image
      uses: ./.github/actions/docker-build-push
      with:
        push_to_ghcr: true
        image_name: oriso-userservice
        github_token: ${{ secrets.GITHUB_TOKEN }}

  # Explicit legacy quarantine: #734, owner @Storypapst, expires 2026-09-30.
  legacy-integration-quarantine:
    name: legacy integration quarantine (#734, expires 2026-09-30)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Run full legacy integration suite
      uses: ./.github/actions/maven-verify-burnin
      with:
        java_version: '21'
