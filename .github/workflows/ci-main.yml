name: UserService Build and Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - pre-dev

env:
  REGISTRY: ghcr.io
  ORG: openresilienceinitiative

jobs:
  mariadb-contract:
    uses: ./.github/workflows/mariadb-contract.yml

  redis-contract:
    uses: ./.github/workflows/redis-contract.yml

  required-integration-tests:
    name: required integration tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Run deterministic integration contract
      uses: ./.github/actions/maven-verify-required
      with:
        java_version: '21'

  publish:
    name: test, build and publish image
    needs: [required-integration-tests, mariadb-contract, redis-contract]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Run UserService tests and build
      uses: ./.github/actions/maven-build
      with:
        java_version: '21'

    - name: Publish UserService Docker image
      uses: ./.github/actions/docker-build-push
      with:
        push_to_ghcr: true
        image_name: oriso-userservice
        github_token: ${{ secrets.GITHUB_TOKEN }}
