name: UserService Build and Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - pre-dev

env:
  REGISTRY: ghcr.io
  ORG: openresilienceinitiative

jobs:
  build:
    name: test and package application
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Run UserService tests and build
      uses: ./.github/actions/maven-build
      with:
        java_version: '21'

    - name: Save the tested application for publication
      uses: actions/upload-artifact@v4
      with:
        name: userservice-jar
        path: target/UserService.jar
        if-no-files-found: error
        compression-level: 0
        retention-days: 1

  mariadb-contract:
    uses: ./.github/workflows/mariadb-contract.yml

  required-integration-tests:
    name: required integration tests
    runs-on: ubuntu-latest
    env:
      ORISO_LOCAL_REDIS_IT: true
    services:
      redis:
        image: redis:7-alpine
        ports:
        - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Run deterministic integration contract
      uses: ./.github/actions/maven-verify-required
      with:
        java_version: '21'

  publish:
    name: scan and publish image
    needs: [build, required-integration-tests, mariadb-contract, notification-smtp-contract]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Download the tested application from this run
      uses: actions/download-artifact@v4
      with:
        name: userservice-jar
        path: target

    - name: Build, scan and publish UserService Docker image
      id: image
      uses: ./.github/actions/docker-build-push
      with:
        push_to_ghcr: true
        image_name: oriso-userservice
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Sign and publish the image provenance attestation
      uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.1.0
      with:
        subject-name: ${{ env.REGISTRY }}/${{ env.ORG }}/oriso-userservice
        subject-digest: ${{ steps.image.outputs.digest }}
        push-to-registry: true

    - name: Record immutable release digest
      run: echo '${{ env.REGISTRY }}/${{ env.ORG }}/oriso-userservice@${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"

  notification-smtp-contract:
    uses: ./.github/workflows/notification-smtp-contract.yml
