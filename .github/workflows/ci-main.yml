name: UserService Build and Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - pre-dev

env:
  REGISTRY: ghcr.io
  ORG: openresilienceinitiative

jobs:
  mariadb-contract:
    uses: ./.github/workflows/mariadb-contract.yml

  required-integration-tests:
    name: required integration tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
        - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Run deterministic integration contract
      uses: ./.github/actions/maven-verify-required
      with:
        java_version: '21'

  publish:
    name: test, build and publish image
    needs: [required-integration-tests, mariadb-contract]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Run UserService tests and build
      uses: ./.github/actions/maven-build
      with:
        java_version: '21'

    - name: Publish UserService Docker image
      id: image
      uses: ./.github/actions/docker-build-push
      with:
        push_to_ghcr: true
        image_name: oriso-userservice
        github_token: ${{ secrets.GITHUB_TOKEN }}
        # Trivy runs inside the action, against a locally built image, and
        # before anything reaches GHCR. It used to run as a separate step
        # after this one, which could only redden the run — the vulnerable
        # image was already published and deployable by then
        # (OpenResilienceInitiative/ORISO-Docs#88).
        scan_before_push: true

    - name: Sign and publish the image provenance attestation
      uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.1.0
      with:
        subject-name: ${{ env.REGISTRY }}/${{ env.ORG }}/oriso-userservice
        subject-digest: ${{ steps.image.outputs.digest }}
        push-to-registry: true

    - name: Record immutable release digest
      run: echo '${{ env.REGISTRY }}/${{ env.ORG }}/oriso-userservice@${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
