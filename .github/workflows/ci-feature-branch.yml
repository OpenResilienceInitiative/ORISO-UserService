name: UserService Branch Validation

on:
  push:
    branches-ignore:
    - main
    - dev
    - pre-dev

env:
  REGISTRY: ghcr.io
  ORG: openresilienceinitiative

permissions:
  contents: read

jobs:
  route-validation:
    name: choose branch or PR validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_validation: ${{ steps.route.outputs.run_validation }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Use PR validation when an open PR already covers this branch
      id: route
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash scripts/ci/should-run-branch-validation.sh

  validate:
    needs: route-validation
    if: needs.route-validation.outputs.run_validation == 'true'
    name: test and build UserService
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Run UserService tests and build
      uses: ./.github/actions/maven-build
      with:
        java_version: '21'

    - name: Docker image security gate without publishing
      uses: ./.github/actions/docker-build-push
      with:
        push_to_ghcr: false
        image_name: oriso-userservice

  required-integration-tests:
    needs: route-validation
    if: needs.route-validation.outputs.run_validation == 'true'
    name: required integration tests
    runs-on: ubuntu-latest
    env:
      ORISO_LOCAL_REDIS_IT: true
    services:
      redis:
        image: redis:7-alpine
        ports:
        - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Run deterministic integration contract
      uses: ./.github/actions/maven-verify-required
      with:
        java_version: '21'

  mariadb-contract:
    needs: route-validation
    if: needs.route-validation.outputs.run_validation == 'true'
    uses: ./.github/workflows/mariadb-contract.yml

  notification-smtp-contract:
    needs: route-validation
    if: needs.route-validation.outputs.run_validation == 'true'
    uses: ./.github/workflows/notification-smtp-contract.yml
