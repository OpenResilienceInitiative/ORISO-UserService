name: UserService Branch Validation

on:
  push:
    branches-ignore:
    - main
    - dev
    - pre-dev

jobs:
  validate:
    name: test and build UserService
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Run UserService tests and build
      uses: ./.github/actions/maven-build
      with:
        java_version: '21'

  required-integration-tests:
    name: required integration tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Run deterministic integration contract
      uses: ./.github/actions/maven-verify-required
      with:
        java_version: '21'

  # Explicit legacy quarantine: #734, owner @Storypapst, expires 2026-09-30.
  legacy-integration-quarantine:
    name: legacy integration quarantine (#734, expires 2026-09-30)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Run full legacy integration suite
      uses: ./.github/actions/maven-verify-burnin
      with:
        java_version: '21'
