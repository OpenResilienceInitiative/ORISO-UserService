name: Reusable UserService MariaDB contract

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: MariaDB schema, statistics, scheduler lease and replica contracts
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: userservice
        ports:
        - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LIQUIBASE_IT_DB_URL: jdbc:mariadb://127.0.0.1:3306/userservice
      LIQUIBASE_IT_DB_PASSWORD: root

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up JDK and Maven
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: temurin
        cache: maven

    - name: Create isolated guest promotion migration database
      run: docker exec "${{ job.services.mariadb.id }}" mariadb -uroot -proot -e 'CREATE DATABASE migration_guest CHARACTER SET utf8 COLLATE utf8_unicode_ci'

    - name: Verify published guest promotion migration histories
      env:
        GUEST_PROMOTION_TEST_DB_URL: jdbc:mariadb://127.0.0.1:3306/migration_guest
        GUEST_PROMOTION_TEST_DB_USER: root
        GUEST_PROMOTION_TEST_DB_PASSWORD: root
      run: |
        rm -f target/surefire-reports/TEST-de.caritas.cob.userservice.api.LiveChatPromotionMigrationIT.xml
        ./mvnw -B -Dskip.unit-tests=true -Dtest=LiveChatPromotionMigrationIT integration-test
        python3 - <<'PYCODE'
        import xml.etree.ElementTree as ET
        report = ET.parse("target/surefire-reports/TEST-de.caritas.cob.userservice.api.LiveChatPromotionMigrationIT.xml").getroot()
        if int(report.attrib["tests"]) != 2 or any(int(report.attrib[key]) != 0 for key in ("skipped", "failures", "errors")):
            raise SystemExit("Guest promotion migration contract must run exactly two passing tests")
        PYCODE

    - name: Verify real MariaDB schema contracts
      run: >-
        ./mvnw -B -Dskip.unit-tests=true
        -Dspring.test.context.cache.maxSize=8
        -Dtest=DatabaseChangelogDriftIT,EnquiryRejectionMariaDbIT,ConsultantTopicUniqueKeyMariaDbIT,ConsultantPictureDatabaseIT,SupportRoomMigrationConvergenceIT,AdminStatisticsRepositoryMariaDbIT,StatisticsRetentionMariaDbIT,ProvisioningCompensationMariaDbIT,ScheduledTaskClaimMariaDbIT,TutorialProgressServiceMariaDbReplicaIT,OrganizerMariaDbReplicaIT,DeactivateGroupChatSchedulerMariaDbReplicaIT,DeleteUserAccountSchedulerMariaDbReplicaIT,DeleteUsersRegisteredOnlySchedulerMariaDbReplicaIT,AccountInviteRevokeAcceptRaceMariaDbIT,SessionOwnershipMariaDbIT,ChatMembersOnlyMariaDbIT,GroupChatMatrixCleanupAdoptionMariaDbIT,ConsultantTenantChangeMariaDbIT,CaseHandoverLeaveAdminPowerMariaDbIT,CaseHandoverTakeoverMatrixMariaDbIT,MoveThenTakeoverMatrixMariaDbIT,CaseHandoverStatusHttpMariaDbIT,IdentityReactivationSagaMariaDbIT,UserHardDeleteClaimMariaDbIT
        integration-test

    - name: Prove authenticated writes across two replicas
      env:
        USERSERVICE_LOAD_REQUESTS: 80
        USERSERVICE_LOAD_CONCURRENCY: 12
      run: ./scripts/load/run-authenticated-write-replicas.sh
