name: Reusable required Maven integration contract

inputs:
  java_version:
    required: true

runs:
  using: composite
  steps:
  - name: Set up JDK and Maven
    uses: actions/setup-java@v5
    with:
      java-version: ${{ inputs.java_version }}
      distribution: temurin
      cache: maven

  - name: Run required integration tests
    shell: bash
    run: scripts/ci/run-required-integration-tests.sh

  - name: Upload required integration reports
    if: ${{ always() }}
    uses: actions/upload-artifact@v4
    with:
      name: required-integration-reports-${{ inputs.java_version }}
      path: target/surefire-reports/*.xml
      if-no-files-found: error
      retention-days: 7
