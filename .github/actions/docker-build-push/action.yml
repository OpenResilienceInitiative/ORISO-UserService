name: Reusable Docker build, scan and publish steps
description: Build and scan each platform before publishing the same OCI image.

inputs:
  push_to_ghcr:
    description: Whether to publish the scanned image to GHCR
    required: true
  image_name:
    description: GHCR image name without registry or organization
    required: true
  github_token:
    description: GitHub token used only when publishing is enabled
    required: false
    default: ''
  platforms:
    description: Comma-separated OCI target platforms
    required: false
    default: linux/amd64,linux/arm64
  image_tags:
    description: Optional newline-separated release tags instead of branch metadata
    required: false
    default: ''
  image_labels:
    description: Optional release labels instead of branch metadata
    required: false
    default: ''

outputs:
  digest:
    description: Immutable digest of the scanned and published image
    value: ${{ steps.publish.outputs.digest }}

runs:
  using: 'composite'
  steps:
  - name: Set up QEMU
    uses: docker/setup-qemu-action@v4

  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v4

  - name: Extract Metadata
    id: meta
    uses: docker/metadata-action@v6
    with:
      images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ inputs.image_name }}
      tags: |
        type=sha
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
        type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
        type=raw,value=pre-dev,enable=${{ github.ref == 'refs/heads/pre-dev' }}

  - name: Build the complete image without publishing
    id: build
    uses: docker/build-push-action@v7
    with:
      context: .
      platforms: ${{ inputs.platforms }}
      push: false
      outputs: type=oci,dest=${{ runner.temp }}/${{ inputs.image_name }}.tar
      provenance: mode=max
      sbom: true
      labels: ${{ inputs.image_labels || steps.meta.outputs.labels }}
      # Keep caches separate for each image built by this shared action.
      cache-from: type=gha,scope=${{ inputs.image_name }}
      cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}

  - name: Install OCI transport
    shell: bash
    run: sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo

  - name: Install Trivy
    uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
    with:
      version: v0.70.0
      cache: true

  - name: Reject fixable high or critical vulnerabilities on every platform
    shell: bash
    env:
      IMAGE_ARCHIVE: ${{ runner.temp }}/${{ inputs.image_name }}.tar
      IMAGE_PLATFORMS: ${{ inputs.platforms }}
    run: bash scripts/ci/scan-image-archive.sh "$IMAGE_ARCHIVE" "$IMAGE_PLATFORMS"

  - name: Login to GitHub Container Registry
    if: ${{ inputs.push_to_ghcr == 'true' }}
    uses: docker/login-action@v4
    with:
      registry: ${{ env.REGISTRY }}
      username: ${{ github.actor }}
      password: ${{ inputs.github_token }}

  - name: Publish the scanned archive without rebuilding
    id: publish
    if: ${{ inputs.push_to_ghcr == 'true' }}
    shell: bash
    env:
      IMAGE_ARCHIVE: ${{ runner.temp }}/${{ inputs.image_name }}.tar
      IMAGE_TAGS: ${{ inputs.image_tags || steps.meta.outputs.tags }}
      EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
    run: bash scripts/ci/publish-image-archive.sh "$IMAGE_ARCHIVE" "$EXPECTED_DIGEST"
