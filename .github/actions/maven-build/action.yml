name: Reusable Maven validation and build steps

inputs:
  java_version:
    required: true

runs:
  using: 'composite'
  steps:
  - name: Set up JDK and Maven
    uses: actions/setup-java@v5
    with:
      java-version: ${{ inputs.java_version }}
      distribution: 'temurin'
      cache: maven

  - name: Run Maven tests
    shell: bash
    run: |
      ./mvnw -B test
      python3 - <<'PY'
      from pathlib import Path
      import sys
      import xml.etree.ElementTree as ET

      failing_reports = []
      for report in Path("target/surefire-reports").glob("TEST-*.xml"):
          root = ET.parse(report).getroot()
          failures = int(root.attrib.get("failures", 0))
          errors = int(root.attrib.get("errors", 0))
          if failures or errors:
              failing_reports.append((report, failures, errors))

      if failing_reports:
          print("Maven reported test failures/errors:")
          for report, failures, errors in failing_reports:
              print(f"- {report}: failures={failures}, errors={errors}")
          sys.exit(1)
      PY
      python3 scripts/ci/verify-test-inventory.py \
        --suite unit \
        --reports target/surefire-reports \
        --classification documentation/user-service-historical-failure-classification.json

  # Also guards against a vacuously green run: the failure check above passes
  # when no report exists at all, --require does not.
  - name: Report unit inventory
    if: ${{ always() }}
    shell: bash
    run: |
      set -o pipefail
      {
        echo "### Unit test inventory"
        echo
        python3 scripts/ci/suite-inventory.py --require unit
      } | tee -a "$GITHUB_STEP_SUMMARY"

  - name: Verify CI and load-test contracts
    shell: bash
    run: python3 -m unittest discover -s tests/ci -p 'test_*.py'

  - name: Package Java application
    shell: bash
    run: ./mvnw -B package -DskipTests
