openapi: 3.0.1
info:
  title: will be replaced
  description: This information will be replaced by the SpringFox config information
  version: 0.0.1
paths:
  /agencies:
    get:
      tags:
        - agency-controller
      summary: 'Returns a randomly sorted list of agencies. If no agency is found the white spot agency id is being returned. When no white spot agency is defined No Content is being returned. [Authorization: none]'
      operationId: getAgencies
      parameters:
        - name: postcode
          in: query
          required: false
          description: The postcode the user entered
          schema:
            type: string
            minLength: 5
            maxLength: 5
            example: '56789'
        - name: consultingType
          in: query
          required: true
          description: The consulting type of the registration form
          schema:
            type: integer
            format: int32
            example: 5
        - name: topicId
          in: query
          required: false
          description: The main topic of the registration form
          schema:
            type: integer
            format: int32
            example: 7
        - name: age
          in: query
          required: false
          description: Age from the registration form
          schema:
            type: integer
            format: int32
            example: 27
        - name: gender
          in: query
          required: false
          description: Gender from the registration form
          schema:
            type: string
            example: FEMALE
        - name: counsellingRelation
          in: query
          required: false
          description: Counselling relation from the registration form
          schema:
            type: string
            example: PARENTAL_COUNSELLING
      responses:
        '200':
          description: OK - successfull operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FullAgencyResponseDTO'
        '400':
          description: BAD REQUEST - invalid/incomplete request or body object
        '403':
          description: FORBIDDEN - no/invalid CSRF token
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /agencies/by-tenant:
    get:
      tags:
        - agency-controller
      summary: 'Returns a list of agencies from a specific tenant (retrieved from the security context). The security context is retrieved from the bearer token, so it is not passed as a request parameter. If no agency is found No Content is being returned. [Authorization: none]'
      operationId: getTenantAgencies
      parameters:
        - name: postcode
          in: query
          required: true
          description: The postcode the user entered
          schema:
            type: string
            minLength: 5
            maxLength: 5
            example: '56789'
        - name: topicId
          in: query
          required: true
          description: The main topic of the registration form
          schema:
            type: integer
            format: int32
            example: 7
      responses:
        '200':
          description: OK - successfull operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FullAgencyResponseDTO'
        '400':
          description: BAD REQUEST - invalid/incomplete request or body object
        '403':
          description: FORBIDDEN - no/invalid CSRF token
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /agencies/topics:
    get:
      tags:
        - agency-controller
      summary: Returns a list of all the topics assigned to all the agencies of a specific tenant
      operationId: getAgenciesTopics
      responses:
        '200':
          description: OK - successfull operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgencyTopicsDTO'
        '400':
          description: BAD REQUEST - invalid/incomplete request or body object
        '403':
          description: FORBIDDEN - no/invalid CSRF token
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /agencies/{agencyIds}:
    get:
      tags:
        - agency-controller
      summary: 'Returns the information of provided agencies (Ids) including settings. [Authorization: none]'
      operationId: getAgenciesByIds
      parameters:
        - name: agencyIds
          in: path
          description: List of comma-seperated Agency IDs
          required: true
          style: simple
          explode: false
          schema:
            type: array
            items:
              type: integer
              format: int64
              example: 20
      responses:
        '200':
          description: OK - successfull operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgencyResponseDTO'
        '400':
          description: BAD REQUEST - invalid/incomplete request or body object
        '403':
          description: FORBIDDEN - no/invalid CSRF token
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /agencies/{agencyId}/topics/{topicId}/legal:
    get:
      tags:
        - agency-controller
      summary: 'Returns the published legal texts (data privacy policy and imprint) of a department (agency x topic). Draft or never-authored texts are returned as null content - drafts are never exposed to users. [Authorization: none]'
      operationId: getDepartmentLegal
      parameters:
        - name: agencyId
          in: path
          description: Agency Id
          required: true
          schema:
            type: integer
            format: int64
        - name: topicId
          in: path
          description: Topic Id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK - successfull operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentLegalDTO'
        '404':
          description: NOT FOUND - department (agency x topic) not found
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /agencies/consultingtype/{consultingTypeId}:
    get:
      tags:
        - agency-controller
      summary: 'Returns all agencies for provided consulting type. [Authorization: none]'
      operationId: getAgenciesByConsultingType
      parameters:
        - name: consultingTypeId
          in: path
          description: the consulting type id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK - successfull operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgencyResponseDTO'
        '400':
          description: BAD REQUEST - invalid/incomplete request or body object
        '403':
          description: FORBIDDEN - no/invalid CSRF token
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
components:
  schemas:
    AgencyResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 684
        name:
          type: string
          example: Suchtberatung Freiburg
        postcode:
          type: string
          example: '79106'
        city:
          type: string
          example: Bonn
        description:
          type: string
          example: 'Our agency provides help for the following topics: Lorem ipsum..'
        teamAgency:
          type: boolean
          example: 'false'
        offline:
          type: boolean
          example: 'false'
        consultingType:
          type: integer
          example: 0
        tenantId:
          type: integer
          format: int64
          example: 12
        agencySpecificPrivacy:
          type: string
          example: specific for agency privacy text
        topicIds:
          type: array
          items:
            type: integer
            format: int64
        agencyLogo:
          type: string
          example: base64 encoded image
        settings:
          $ref: '#/components/schemas/Settings'
    FullAgencyResponseDTO:
      type: object
      allOf:
        - $ref: '#/components/schemas/AgencyResponseDTO'
        - type: object
          properties:
            demographics:
              $ref: '#/components/schemas/DemographicsDTO'
            url:
              type: string
              example: http://www.domain.com/agency
            external:
              type: boolean
              example: 'false'
            departments:
              type: array
              description: The agency's departments (one per assigned topic) with the publication state of their own legal texts. Optional - older clients can ignore it.
              items:
                $ref: '#/components/schemas/AgencyDepartmentDTO'
    AgencyDepartmentDTO:
      type: object
      properties:
        topicId:
          type: integer
          format: int64
          example: 7
        hasPublishedDpp:
          type: boolean
          description: true if the department has a published data privacy policy of its own
          example: true
        hasPublishedImprint:
          type: boolean
          description: true if the department has a published imprint of its own
          example: false
    DepartmentLegalDTO:
      type: object
      required:
        - dpp
        - imprint
      properties:
        dpp:
          $ref: '#/components/schemas/DepartmentLegalContentDTO'
        imprint:
          $ref: '#/components/schemas/DepartmentLegalContentDTO'
    DepartmentLegalContentDTO:
      type: object
      properties:
        content:
          type: string
          nullable: true
          description: Published multilingual content as a JSON language->HTML map string; null when the text is a draft or was never authored (drafts are never exposed)
    AgencyTopicsDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 684
        name:
          type: string
          example: Adoption and fostering a child
    DemographicsDTO:
      type: object
      properties:
        ageFrom:
          type: integer
          minimum: 0
          maximum: 200
          example: 25
        ageTo:
          type: integer
          minimum: 0
          maximum: 200
          example: 55
        genders:
          type: array
          items:
            type: string
          example: '[MALE,FEMALE,DIVERS]'
    AgencyAdminAllowedPermissionToggles:
      type: object
      properties:
        appearance:
          type: boolean
          example: true
        anonymousChat:
          type: boolean
          example: true
        calls:
          type: boolean
          example: true
        groupChat:
          type: boolean
          example: true
        supervision:
          type: boolean
          example: true
        supervisionAnonymousChats:
          type: boolean
          example: true
        supervisionOneOnOneChats:
          type: boolean
          example: true
        audioCalls:
          type: boolean
          example: true
        audioCallsAnonymousChats:
          type: boolean
          example: true
        audioCallsOneOnOneChats:
          type: boolean
          example: true
        audioCallsGroupChats:
          type: boolean
          example: true
        audioCallsSupervisionChats:
          type: boolean
          example: true
        videoCalls:
          type: boolean
          example: true
        videoCallsAnonymousChats:
          type: boolean
          example: true
        videoCallsOneOnOneChats:
          type: boolean
          example: true
        videoCallsGroupChats:
          type: boolean
          example: true
        videoCallsSupervisionChats:
          type: boolean
          example: true
        threads:
          type: boolean
          example: true
        threadsAnonymousChats:
          type: boolean
          example: true
        threadsOneOnOneChats:
          type: boolean
          example: true
        threadsGroupChats:
          type: boolean
          example: true
        threadsSupervisionChats:
          type: boolean
          example: true
        voiceMessages:
          type: boolean
          example: true
        voiceMessagesAnonymousChats:
          type: boolean
          example: true
        voiceMessagesOneOnOneChats:
          type: boolean
          example: true
        voiceMessagesGroupChats:
          type: boolean
          example: true
        voiceMessagesSupervisionChats:
          type: boolean
          example: true
        mediaUpload:
          type: boolean
          example: true
        mediaUploadAnonymousChats:
          type: boolean
          example: true
        mediaUploadOneOnOneChats:
          type: boolean
          example: true
        mediaUploadGroupChats:
          type: boolean
          example: true
        mediaUploadSupervisionChats:
          type: boolean
          example: true
        mediaInlineDisplay:
          type: boolean
          example: true
        mediaInlineDisplayAnonymousChats:
          type: boolean
          example: true
        mediaInlineDisplayOneOnOneChats:
          type: boolean
          example: true
        mediaInlineDisplayGroupChats:
          type: boolean
          example: true
        mediaInlineDisplaySupervisionChats:
          type: boolean
          example: true
        mediaAiScan:
          type: boolean
          example: true
        mediaAiScanAnonymousChats:
          type: boolean
          example: true
        mediaAiScanOneOnOneChats:
          type: boolean
          example: true
        mediaAiScanGroupChats:
          type: boolean
          example: true
        mediaAiScanSupervisionChats:
          type: boolean
          example: true
    AgencyAdminControls:
      type: object
      properties:
        permissionsPageEnabled:
          type: boolean
          example: true
        allowedPermissionToggles:
          $ref: '#/components/schemas/AgencyAdminAllowedPermissionToggles'
        enforcedPermissionToggles:
          $ref: '#/components/schemas/AgencyAdminAllowedPermissionToggles'
    Settings:
      type: object
      properties:
        featureStatisticsEnabled:
          type: boolean
          example: false
        featureTopicsEnabled:
          type: boolean
          example: false
        topicsInRegistrationEnabled:
          type: boolean
          example: false
        featureDemographicsEnabled:
          type: boolean
          example: false
        featureAppointmentsEnabled:
          type: boolean
          example: false
        featureGroupChatV2Enabled:
          type: boolean
          example: false
        featureToolsEnabled:
          type: boolean
          example: false
        featureAnonymousChatEnabled:
          type: boolean
          example: true
        featureCallsEnabled:
          type: boolean
          example: true
        featureSupervisionEnabled:
          type: boolean
          example: true
          description: Master toggle for supervision functionality (adding/removing supervisors, supervision views).
        featureSupervisionAnonymousChatsEnabled:
          type: boolean
          example: true
          description: Enable supervision functionality in anonymous chats.
        featureSupervisionOneOnOneChatsEnabled:
          type: boolean
          example: true
          description: Enable supervision functionality in 1-on-1 chats.
        featureAudioCallsEnabled:
          type: boolean
          example: true
          description: Master toggle for audio call button availability (all chat types).
        featureAudioCallsAnonymousChatsEnabled:
          type: boolean
          example: true
          description: Enable audio call button in anonymous chats.
        featureAudioCallsOneOnOneChatsEnabled:
          type: boolean
          example: true
          description: Enable audio call button in 1-on-1 chats.
        featureAudioCallsGroupChatsEnabled:
          type: boolean
          example: true
          description: Enable audio call button in group chats.
        featureAudioCallsSupervisionChatsEnabled:
          type: boolean
          example: true
          description: Enable audio call button when a user is in supervision mode.
        featureVideoCallsEnabled:
          type: boolean
          example: true
          description: Master toggle for video call button availability (all chat types).
        featureVideoCallsAnonymousChatsEnabled:
          type: boolean
          example: true
          description: Enable video call button in anonymous chats.
        featureVideoCallsOneOnOneChatsEnabled:
          type: boolean
          example: true
          description: Enable video call button in 1-on-1 chats.
        featureVideoCallsGroupChatsEnabled:
          type: boolean
          example: true
          description: Enable video call button in group chats.
        featureVideoCallsSupervisionChatsEnabled:
          type: boolean
          example: true
          description: Enable video call button when a user is in supervision mode.
        featureThreadsEnabled:
          type: boolean
          example: true
          description: Master toggle for threads availability (all chat types).
        featureThreadsAnonymousChatsEnabled:
          type: boolean
          example: true
          description: Enable threads in anonymous chats.
        featureThreadsGroupChatsEnabled:
          type: boolean
          example: true
          description: Enable threads in group chats.
        featureThreadsOneOnOneEnabled:
          type: boolean
          example: true
          description: Enable threads in 1-on-1 chats.
        featureThreadsSupervisionChatsEnabled:
          type: boolean
          example: true
          description: Enable threads when a user is in supervision mode.
        featureVoiceMessagesEnabled:
          type: boolean
          example: true
          description: Master toggle for voice messages availability (all chat types).
        featureVoiceMessagesAnonymousChatsEnabled:
          type: boolean
          example: true
          description: Enable voice messages in anonymous chats.
        featureVoiceMessagesOneOnOneChatsEnabled:
          type: boolean
          example: true
          description: Enable voice messages in 1-on-1 chats.
        featureVoiceMessagesGroupChatsEnabled:
          type: boolean
          example: true
          description: Enable voice messages in group chats.
        featureVoiceMessagesSupervisionChatsEnabled:
          type: boolean
          example: true
          description: Enable voice messages when a user is in supervision mode.
        featureMediaUploadEnabled:
          type: boolean
          example: true
          description: 'Master toggle: may images/media be uploaded into chats at all. Replaces the retired featureAttachmentUploadDisabled (ADR-015).'
        featureMediaUploadAnonymousChatsEnabled:
          type: boolean
          example: true
          description: Enable media upload in anonymous chats.
        featureMediaUploadOneOnOneChatsEnabled:
          type: boolean
          example: true
          description: Enable media upload in 1-on-1 chats.
        featureMediaUploadGroupChatsEnabled:
          type: boolean
          example: true
          description: Enable media upload in group chats.
        featureMediaUploadSupervisionChatsEnabled:
          type: boolean
          example: true
          description: Enable media upload when a user is in supervision mode.
        featureMediaInlineDisplayEnabled:
          type: boolean
          example: true
          description: 'Master toggle: render media as scaled thumbnails (on) or deliver as downloadable file only (off). The virus-scan requirement is attached to this switch.'
        featureMediaInlineDisplayAnonymousChatsEnabled:
          type: boolean
          example: true
          description: Inline media display in anonymous chats.
        featureMediaInlineDisplayOneOnOneChatsEnabled:
          type: boolean
          example: true
          description: Inline media display in 1-on-1 chats.
        featureMediaInlineDisplayGroupChatsEnabled:
          type: boolean
          example: true
          description: Inline media display in group chats.
        featureMediaInlineDisplaySupervisionChatsEnabled:
          type: boolean
          example: true
          description: Inline media display when a user is in supervision mode.
        featureMediaAiScanEnabled:
          type: boolean
          example: false
          description: 'Master toggle: AI content check sets the media check state automatically; off = blurred until counsellor click-to-reveal.'
        featureMediaAiScanAnonymousChatsEnabled:
          type: boolean
          example: false
          description: AI media scan for anonymous chats.
        featureMediaAiScanOneOnOneChatsEnabled:
          type: boolean
          example: false
          description: AI media scan for 1-on-1 chats.
        featureMediaAiScanGroupChatsEnabled:
          type: boolean
          example: false
          description: AI media scan for group chats.
        featureMediaAiScanSupervisionChatsEnabled:
          type: boolean
          example: false
          description: AI media scan when a user is in supervision mode.
        featureToolsOICDToken:
          type: string
          example: 1234-1234-1234-1234
        activeLanguages:
          type: array
          items:
            type: string
          example: '[en, de, fr]'
        showAskerProfile:
          type: boolean
          default: false
          example: false
        isVideoCallAllowed:
          type: boolean
          default: false
          example: false
        featureSystemNotificationEmailsEnabled:
          type: boolean
          example: false
        featureCentralDataProtectionTemplateEnabled:
          type: boolean
          example: false
        agencyAdminControls:
          $ref: '#/components/schemas/AgencyAdminControls'
  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
