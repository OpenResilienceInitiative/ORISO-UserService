        204:
          description: NO CONTENT - successful operation
        400:
          description: BAD REQUEST - no legal version supplied
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - no/invalid role/authorization or CSRF token, or the session
            does not belong to the authenticated help-seeker
        404:
          description: NOT FOUND - session not found
        409:
          description: CONFLICT - this room has no consent gate (no help-seeker owns it)
