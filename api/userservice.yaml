  /users/admin/service-notices/drafts/{campaignKey}/confirm:
    post:
      tags: [service-notice-confirm-controller]
      operationId: confirmServiceNoticeDraft
      summary: Confirm a planned notice - records its recipients once and queues their mail
      description: >-
        Implemented by the handwritten platform-administrator controller; the /service-prefixed
        ingress alias serves the same operation. Only the operator who created the draft may
        confirm it. The body repeats the recipient count from the dry run; a different current
        count is refused. Repeating a confirmation records nothing new. Mail is delivered later by
        the separate, opt-in sender.
      x-internal: true
      security:
        - Bearer: []
      parameters:
        - name: campaignKey
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9-]{0,79}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceNoticeConfirmRequest' }
      responses:
        '200':
          description: Confirmed now, or already confirmed earlier (alreadyConfirmed true); Cache-Control no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceNoticeConfirmed' }
        '400': { description: Recipient count missing }
        '401': { description: Missing or invalid bearer token }
        '403': { description: "Caller is not a platform administrator, or did not create the draft" }
        '404': { description: Draft not found }
        '409': { description: "Audience changed since the dry run, audience empty, or maintenance window already over" }

  /users/chat-series/{seriesId}/join-requests:
