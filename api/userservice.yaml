      security:
        - Bearer: []
      parameters:
        - name: campaignKey
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9-]{0,79}$' }
      responses:
        '200':
          description: Current audience counts; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceNoticeDryRun' }
