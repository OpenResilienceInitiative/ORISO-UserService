  /users/admin/service-notices/drafts/{campaignKey}:
    put:
      tags: [service-notice-draft-controller]
      operationId: saveServiceNoticeDraft
      summary: Save one planned-maintenance draft without selecting recipients or sending
      description: Implemented by the handwritten platform-administrator controller; the /service-prefixed ingress alias serves the same operation.
      x-internal: true
      security:
        - Bearer: []
      parameters:
        - name: campaignKey
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9-]{0,79}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceNoticeDraftInput' }
      responses:
        '200':
          description: Draft saved, or the identical draft retried by its original operator; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceNoticeDraftView' }
        '400': { description: Invalid key or window or public HTTPS status URL }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Caller is not a platform administrator }
        '409': { description: Campaign key already belongs to a different draft or operator }
    get:
      tags: [service-notice-draft-controller]
      operationId: getServiceNoticeDraft
      summary: Read one planned-maintenance draft without sending
      description: Implemented by the handwritten platform-administrator controller; the /service-prefixed ingress alias serves the same operation.
      x-internal: true
      security:
        - Bearer: []
      parameters:
        - name: campaignKey
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9-]{0,79}$' }
      responses:
        '200':
          description: Existing draft; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceNoticeDraftView' }
        '400': { description: Invalid campaign key }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Caller is not a platform administrator }
        '404': { description: Draft not found }
  /users/admin/service-notices/drafts/{campaignKey}/preview:
    get:
      tags: [service-notice-draft-controller]
      operationId: previewServiceNoticeDraft
      summary: Preview actual subject, preheader, HTML and text without sending
      description: Implemented by the handwritten platform-administrator controller; the /service-prefixed ingress alias serves the same operation.
      x-internal: true
      security:
        - Bearer: []
      parameters:
        - name: campaignKey
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9-]{0,79}$' }
        - name: variant
          in: query
          required: true
          schema: { type: string, enum: [de-sie, de-du, en, fr, ru, ti, tr] }
