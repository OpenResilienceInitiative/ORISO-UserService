openapi: 3.0.1
info:
  title: will be replaced
  description: This information will be replaced by the SpringFox config information
  version: 0.0.1
externalDocs:
  description: Account inactivity lifecycle and platform administration API.
  url: ./account-inactivity.yaml
paths:
  /users/identity-suggestions:
    post:
      tags: [guest-identity-controller]
      operationId: suggestGuestIdentities
      summary: Read available guest names without creating or reserving an account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestIdentitySuggestionRequest'
      responses:
        '200':
          description: Distinct checked suggestions; availability is a snapshot, not a reservation
          content:
            application/json:
              schema:
                type: array
                maxItems: 4
                items:
                  $ref: '#/components/schemas/GuestIdentitySuggestion'
        '400':
          description: Invalid or unbounded request
        '429':
          description: Public request limit exceeded
        '503':
          description: Availability unknown or bounded generation attempts exhausted
  /users/invitelinks/{token}/context:
    get:
      tags: [guest-identity-controller]
      operationId: getGuestInvitationContext
      summary: Read public invitation context without account creation or link mutation
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Public entry context; no credentials or administrative metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestInvitationContext'
        '400':
          description: Inactive or expired invitation
        '404':
          description: Invitation not found
        '410':
          description: The direct link was switched off; body {"reason":"DIRECT_LINK_INACTIVE"}
  /users/invitelinks/{token}/conversations:
    post:
      tags: [direct-link-controller]
      operationId: startDirectLinkConversation
      summary: 'Open (or reopen) the caller''s own 1:1 conversation through a counsellor direct link [Authorization: Role: user]'
      description: >-
        Every person gets their own conversation with the link owner. It is assigned to the
        counsellor directly (like the contact link) and never enters the enquiry inbox. A second
        call by the same person returns the existing conversation. Audio and video links answer
        admission KNOCK: the person waits until the counsellor admits them (ADR-029 §2). Let in
        once: after an admission every later visit returns it (callAdmitted true) and opens no new
        knock; after a decline the next visit knocks again.
      security:
        - Bearer: [ ]
      parameters:
        - name: token
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: The caller already had a conversation through this counsellor and topic
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DirectLinkConversationDTO'}
        '201':
          description: A new conversation was created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DirectLinkConversationDTO'}
        '400': {description: 'Expired link, or not a counsellor direct link'}
        '401': {description: UNAUTHORIZED - no/invalid Keycloak token}
        '403': {description: 'Direct invitations are not allowed here, or the caller belongs to another Träger'}
        '404': {description: Unknown link}
        '410': {description: 'The link was switched off; body {"reason":"DIRECT_LINK_INACTIVE"}'}
  /users/call-knocks:
    get:
      tags: [direct-link-controller]
      operationId: getPendingCallKnocks
      summary: 'People waiting to be let into a call in one of the caller''s conversations, oldest first [Authorization: Role: consultant]'
      description: >-
        With sessionId or matrixRoomId only the knocks of that call; without either all of the
        caller's waiting knocks (unchanged behaviour). Knocks through a call share link (#1487)
        count as knocks of the call whose conversation room is matrixRoomId; a room without a 1:1
        conversation (a group call) is accepted when a call ran in it and lists only those.
      security:
        - Bearer: [ ]
      parameters:
        - name: sessionId
          in: query
          required: false
          description: The conversation of the current call.
          schema: {type: integer, format: int64}
        - name: matrixRoomId
          in: query
          required: false
          description: The Matrix room of the current call (the conversation's room).
          schema: {type: string}
      responses:
        '200':
          description: Pending knocks of the last two hours
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CallKnockDTO'}
        '400': {description: sessionId and matrixRoomId name different conversations}
        '401': {description: UNAUTHORIZED - no/invalid Keycloak token}
        '403': {description: Caller is not a consultant}
  /users/call-knocks/admit-all:
    post:
      tags: [direct-link-controller]
      operationId: admitAllCallKnocks
      summary: 'Let everybody in who is waiting for the caller''s current call [Authorization: Role: consultant]'
      description: >-
        Scoped to one call: sessionId or matrixRoomId is required, otherwise 400. Knocks in the
        caller's other conversations stay waiting.
      security:
        - Bearer: [ ]
      parameters:
        - name: sessionId
          in: query
          required: false
          description: The conversation of the current call.
          schema: {type: integer, format: int64}
        - name: matrixRoomId
          in: query
          required: false
          description: The Matrix room of the current call (the conversation's room).
          schema: {type: string}
      responses:
        '200':
          description: The knocks that were admitted
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CallKnockDTO'}
        '400': {description: 'Neither sessionId nor matrixRoomId, or both naming different conversations'}
        '401': {description: UNAUTHORIZED - no/invalid Keycloak token}
        '403': {description: Caller is not a consultant}
  /users/call-knocks/{knockId}/admit:
    post:
      tags: [direct-link-controller]
      operationId: admitCallKnock
      summary: 'Let one person into the call (idempotent) [Authorization: Role: consultant]'
      security:
        - Bearer: [ ]
      parameters:
        - name: knockId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: The admitted knock
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CallKnockDTO'}
        '401': {description: UNAUTHORIZED - no/invalid Keycloak token}
        '404': {description: No knock on one of the caller's conversations with this id}
        '409': {description: The knock was already declined or cancelled}
  /users/call-knocks/{knockId}/decline:
    post:
      tags: [direct-link-controller]
      operationId: declineCallKnock
      summary: 'Do not let the person in (idempotent) [Authorization: Role: consultant]'
      security:
        - Bearer: [ ]
      parameters:
        - name: knockId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: The declined knock
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CallKnockDTO'}
        '401': {description: UNAUTHORIZED - no/invalid Keycloak token}
        '404': {description: No knock on one of the caller's conversations with this id}
        '409': {description: The knock was already admitted or cancelled}
  /users/call-knocks/mine:
    get:
      tags: [direct-link-controller]
      operationId: getOwnCallKnockForSession
      summary: 'The caller''s call admission in one of their conversations, on any device [Authorization: Role: user]'
      description: >-
        Let in once: returns the caller's ADMITTED knock in this conversation if there is one,
        otherwise their latest knock there. ADMITTED means the person joins every later call in
        this conversation directly, without knocking.
      security:
        - Bearer: [ ]
      parameters:
        - name: sessionId
          in: query
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: The admission, or the latest knock
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CallKnockDTO'}
        '401': {description: UNAUTHORIZED - no/invalid Keycloak token}
        '403': {description: Caller is not a user}
        '404': {description: The caller never knocked in this conversation}
  /users/call-knocks/mine/{knockId}:
    get:
      tags: [direct-link-controller]
      operationId: getOwnCallKnock
      summary: 'The state of the caller''s own knock, for the waiting room [Authorization: Role: user]'
      security:
        - Bearer: [ ]
      parameters:
        - name: knockId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: The knock
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CallKnockDTO'}
        '401': {description: UNAUTHORIZED - no/invalid Keycloak token}
        '404': {description: No own knock with this id}
    delete:
      tags: [direct-link-controller]
      operationId: cancelOwnCallKnock
      summary: 'Stop waiting (idempotent) [Authorization: Role: user]'
      security:
        - Bearer: [ ]
      parameters:
        - name: knockId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: The knock after cancelling
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CallKnockDTO'}
        '401': {description: UNAUTHORIZED - no/invalid Keycloak token}
        '404': {description: No own knock with this id}
  /users/temporary-account:
    get:
      tags: [direct-link-controller]
      operationId: getOwnTemporaryAccount
      summary: 'The caller''s own temporary account from a direct link: retention mode and answer (ADR-029 §5) [Authorization: Role: user]'
      security:
        - Bearer: [ ]
      responses:
        '200':
          description: The temporary account
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemporaryAccountDTO'}
        '401': {description: UNAUTHORIZED - no/invalid Keycloak token}
        '404': {description: The caller has no direct-link temporary account}
  /users/temporary-account/message-retention:
    put:
      tags: [direct-link-controller]
      operationId: decideTemporaryAccountMessageRetention
      summary: 'The guest''s once-per-conversation answer under GUEST_DECIDES: keep the messages or delete them with the account [Authorization: Role: user]'
      security:
        - Bearer: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TemporaryAccountRetentionDecisionDTO'}
      responses:
        '200':
          description: The temporary account with the answer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemporaryAccountDTO'}
        '400': {description: keepMessages missing}
        '401': {description: UNAUTHORIZED - no/invalid Keycloak token}
        '404': {description: The caller has no direct-link temporary account}
        '409': {description: 'The platform mode does not ask the guest, or the guest already answered'}
  /users/directlinks:
    get:
      tags: [direct-link-controller]
      operationId: getOwnDirectLinks
      summary: 'List the caller''s own direct links, newest first [Authorization: Role: consultant]'
      security:
        - Bearer: [ ]
      responses:
        '200':
          description: The caller's direct links (switched-off ones included)
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/DirectLinkDTO'}
        '401': {description: UNAUTHORIZED - no/invalid Keycloak token}
        '403': {description: Caller is not a consultant}
    post:
      tags: [direct-link-controller]
      operationId: createDirectLink
      summary: 'Create a direct link for chat, audio or video [Authorization: Role: consultant]'
      security:
        - Bearer: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateDirectLinkDTO'}
      responses:
        '201':
          description: The new link
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DirectLinkDTO'}
        '400': {description: 'Missing or invalid field, or agencyId needed because the caller works for several Beratungsstellen'}
        '401': {description: UNAUTHORIZED - no/invalid Keycloak token}
        '403': {description: 'Caller is not a consultant, not in the agency, or direct invitations are not allowed here'}
        '404': {description: Unknown topic}
  /users/directlinks/{linkId}:
    patch:
      tags: [direct-link-controller]
      operationId: updateDirectLink
      summary: 'Change name, topic, temporary flag or on/off of an own direct link; the medium is fixed [Authorization: Role: consultant]'
      security:
        - Bearer: [ ]
      parameters:
        - name: linkId
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateDirectLinkDTO'}
      responses:
        '200':
          description: The changed link
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DirectLinkDTO'}
        '400': {description: Invalid field}
        '401': {description: UNAUTHORIZED - no/invalid Keycloak token}
        '403': {description: Switching on is not allowed here}
        '404': {description: No own direct link with this id}
    delete:
      tags: [direct-link-controller]
      operationId: deleteDirectLink
      summary: 'Delete an own direct link; conversations started through it stay [Authorization: Role: consultant]'
      security:
        - Bearer: [ ]
      parameters:
        - name: linkId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '204': {description: Deleted}
        '401': {description: UNAUTHORIZED - no/invalid Keycloak token}
        '404': {description: No own direct link with this id}
  /users/{username}:
    get:
      tags:
        - user-controller
      summary: Checks if a given user exists, provided a username
      operationId: userExists
      parameters:
        - name: username
          in: path
          description: username
          required: true
          schema:
              type: string
      responses:
        200:
          description: OK - user exists
        404:
          description: NOT FOUND - user does not exist
  /users/askers/new:
    post:
      tags:
        - user-controller
      summary: 'Register a user [Authorization: none]'
      operationId: registerUser
      requestBody:
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/UserDTO'
        required: true
      responses:
        201:
          description: CREATED - user was created successfully
        400:
          description: BAD REQUEST - invalid/incomplete request or body object
        403:
          description: FORBIDDEN - no/invalid CSRF token
        409:
          description: CONFLICT - invalid/unavailable username
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: [ ]
  /users/askers/session/new:
    post:
      tags:
        - user-controller
      summary: 'Register a new session for an existing asker [Authorization: Role: user]'
      operationId: registerNewSession
      requestBody:
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/NewRegistrationDto'
        required: true
      responses:
        201:
          description: CREATED - session was registered successfully
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/NewRegistrationResponseDto'
        400:
          description: BAD REQUEST - invalid/incomplete request or body object
        403:
          description: FORBIDDEN - no/invalid role/authorization or CSRF token
        409:
          description: CONFLICT - user is already registered for provided topic
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/NewRegistrationResponseDto'
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: [ ]
  /users/askers/consultingType/new:
    post:
      tags:
        - user-controller
      summary: 'Register a new consulting type for an existing asker [Authorization: Role: user]'
      operationId: registerNewConsultingType
      requestBody:
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/NewRegistrationDto'
        required: true
      responses:
        201:
          description: CREATED - session was registered successfully
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/NewRegistrationResponseDto'
        400:
          description: BAD REQUEST - invalid/incomplete request or body object
        403:
          description: FORBIDDEN - no/invalid role/authorization or CSRF token
        409:
          description: CONFLICT - user is already registered for provided consulting type or to given consultant
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/NewRegistrationResponseDto'
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: [ ]
  /users/sessions/{sessionId}/enquiry/permission:
    get:
      tags:
        - user-controller
      summary: 'Check whether the authenticated asker may send their first enquiry before submitting an encrypted Matrix event [Authorization: Role: user]'
      operationId: checkEnquiryPermission
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        204:
          description: NO CONTENT - first enquiry may be sent; finalization checks permission again
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
        400:
          description: BAD REQUEST - session is missing, belongs to another asker, or is anonymous
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - invalid role or AVV does not permit new counselling
          headers:
            X-Reason:
              schema:
                type: string
                example: DPA_NEW_COUNSELLING_NOT_ALLOWED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DpaPolicyErrorDTO'
        409:
          description: CONFLICT - enquiry already written or session is no longer open for an enquiry
        502:
          description: BAD GATEWAY - AVV owner unavailable or response invalid
          headers:
            X-Reason:
              schema:
                type: string
                example: DPA_POLICY_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DpaPolicyErrorDTO'
      security:
        - Bearer: [ ]
  /users/sessions/{sessionId}/enquiry/new:
    post:
      tags:
        - user-controller
      summary: 'Create enquiry message for a user [Authorization: Role: user]'
      operationId: createEnquiryMessage
      parameters:
        - name: sessionId
          in: path
          description: Session Id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/EnquiryMessageDTO'
        required: true
      responses:
        201:
          description: CREATED - enquiry message has been created
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/CreateEnquiryMessageResponseDTO'
        400:
          description: BAD REQUEST - invalid/incomplete request or body object
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - no/invalid role/authorization or CSRF token
        409:
          description: CONFLICT - message already saved for enquiry
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: [ ]
  /users/sessions/{sessionId}/data:
    put:
      tags:
        - user-controller
      summary: 'Update the (user) information of a session [Authorization: Role: user]'
      operationId: updateSessionData
      parameters:
        - name: sessionId
          in: path
          description: session ID
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/SessionDataDTO'
        required: true
      responses:
        200:
          description: OK - successful operation
        400:
          description: BAD REQUEST - invalid/incomplete request or body object
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - no/invalid role/authorization or CSRF token
        404:
          description: NOT FOUND - Session not found
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: [ ]
  /users/sessions/{sessionId}/rejection:
    post:
      tags:
        - user-controller
      summary: 'Reject a submitted ordinary agency enquiry [Authorization: Role: consultant]'
      operationId: rejectEnquiry
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        204:
          description: NO CONTENT - rejected and protocol closure verified
        401:
          description: UNAUTHORIZED - no valid authentication
        403:
          description: FORBIDDEN - current agency authority required
        404:
          description: NOT FOUND - no accessible session
        409:
          description: CONFLICT - enquiry changed, already accepted, or other rejection actor
        503:
          description: SERVICE UNAVAILABLE - rejection saved, protocol closure remains pending
        500:
          description: INTERNAL SERVER ERROR - unexpected failure
      security:
        - Bearer: [ ]
  /users/sessions/{sessionId}/further-counselling-recommendation:
    post:
      tags:
        - user-controller
      summary: 'Recommend further counselling on a topic (FE#1876) [Authorization: Role:
        consultant]'
      description: >-
        Posts a FURTHER_COUNSELLING_RECOMMENDED system notice into the room. Only the assigned
        counsellor of an accepted 1:1 conversation may call it. The notice carries no postcode
        and no asker data.
      operationId: recommendFurtherCounselling
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FurtherCounsellingRecommendationDTO'
        required: true
      responses:
        204:
          description: NO CONTENT - notice posted
        400:
          description: BAD REQUEST - topic missing or unknown, or note longer than 1000 characters
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - caller is not the assigned counsellor
        404:
          description: NOT FOUND - session not found
        409:
          description: CONFLICT - session is no accepted 1:1 conversation (enquiry, group, archived)
        500:
          description: INTERNAL SERVER ERROR - the notice could not be posted
      security:
        - Bearer: [ ]
  /users/askers/sessions/{sessionId}/end-duplicate:
    put:
      tags:
        - user-controller
      summary: 'End the newer of two accepted same-topic conversations (FE#1876) [Authorization:
        Role: user]'
      description: >-
        Archives the session like the counsellor archive does and posts TOPIC_DUPLICATE_ENDED
        into every older accepted conversation of the asker on the same topic.
      operationId: endTopicDuplicate
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        204:
          description: NO CONTENT - session archived
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - caller does not own the session
        404:
          description: NOT FOUND - session not found
        409:
          description: CONFLICT - session is not accepted, or there is no older accepted
            conversation on the same topic
      security:
        - Bearer: [ ]
  /users/sessions/new/{sessionId}:
    put:
      tags:
        - user-controller
      summary: 'Accept an enquiry and assign it to the currently authenticated consultant
        [Authorization: Role: consultant]'
      operationId: acceptEnquiry
      parameters:
        - name: sessionId
          in: path
          description: Session Id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: OK - successful operation
        400:
          description: BAD REQUEST - invalid/incomplete request or body object
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - agency doesn't match/isn't assigned to this enquiry
            or no/invalid CSRF token
        409:
          description: CONFLICT - enquiry already accepted by another consultant or
            agency of session is not assigned to consultant
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: [ ]
  /users/sessions/askers:
    get:
      tags:
        - user-controller
      summary: 'Returns a list of open session(s) for the currently authenticated
        user. Note: Either a session or a chat object is provided. [Authorization:
        Role: user, anonymous]'
      operationId: getSessionsForAuthenticatedUser
      responses:
        200:
          description: OK - successful operation
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/UserSessionListResponseDTO'
        204:
          description: NO CONTENT - no enquiry sent yet
        400:
          description: BAD REQUEST - invalid/incomplete request or body object
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - no/invalid role/authorization or CSRF token
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: [ ]
  /users/sessions/room:
    get:
      tags:
        - user-controller
      summary: 'Returns sessions for given Matrix room IDs.
        [Authorization: Role: user, consultant]'
      operationId: getSessionsForRoomIds
      parameters:
        - name: roomIds[]
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
      responses:
