      summary: 'The agency admins of one of the caller''s own counselling centres that can be invited into an internal chat [Authorization: Role: consultant]'
      description: >-
        Returns, for a counselling centre the caller belongs to, the agency admins who are also active counsellors of that centre with a
        chat identity, i.e. exactly the people POST /users/chat/internal-subset can invite. Only the id and the internal display name are
        returned (no e-mail, user name or other personal data). The caller is never listed. An empty list means nobody can be contacted.
        A centre the caller does not belong to answers 403, whether or not it exists.
      operationId: getAgencyAdminContacts
      parameters:
        - name: agencyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: OK - possibly empty
          content:
            'application/json':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgencyAdminContactDTO'
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - the caller is not a counsellor of this counselling centre
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: [ ]
  /users/chat/internal-subset:
    post:
      tags:
        - user-controller
      summary: 'Open the members-only room for a subset of selected colleagues: a dedicated encrypted room with exactly the caller and the selected colleagues, created or reused [Authorization: Role: consultant with authority CREATE_NEW_CHAT]'
      description: >-
        Every selected colleague must be within the recipient scope of the caller's Träger (counselling centre, Träger or platform;
        TenantService setting internalGroupChat.recipientScope, counselling centre when unset). One colleague outside the scope refuses
        the whole request; nobody is dropped silently and no broader room is ever used. A room that holds exactly the same members is reused (200).
        The room is members-only: no other colleague can list, open or join it. Every error answers with the header and the body field
        X-Reason / reason set to one of the codes below.
      operationId: openInternalSubsetChat
      requestBody:
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/InternalSubsetChatDTO'
        required: true
      responses:
        200:
          description: OK - a room with exactly these members already existed and is reused
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/InternalSubsetChatResponseDTO'
        201:
          description: CREATED - a new members-only encrypted room was created
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/InternalSubsetChatResponseDTO'
        400:
          description: >-
            BAD REQUEST - X-Reason INTERNAL_CHAT_RECIPIENTS_REQUIRED (no colleague besides the caller) or
            INTERNAL_CHAT_RECIPIENT_UNKNOWN (a colleague the caller may pick has no chat identity yet and cannot join a room,
            or an entry of consultantIds is null or blank; the selection is never shortened silently)
          headers:
            X-Reason:
              schema:
                type: string
                example: INTERNAL_CHAT_RECIPIENT_UNKNOWN
        403:
          description: >-
            FORBIDDEN - X-Reason INTERNAL_CHAT_RECIPIENT_OUT_OF_SCOPE (a selected colleague is outside the recipient scope or
            is not an active consultant; both answer alike),
            or internal group chats are switched off for the Träger or counselling centre (no X-Reason)
          headers:
            X-Reason:
              schema:
                type: string
                example: INTERNAL_CHAT_RECIPIENT_OUT_OF_SCOPE
        502:
          description: >-
            BAD GATEWAY - X-Reason INTERNAL_CHAT_MEMBERSHIP_FAILED (the chat service could not add every selected colleague; nothing was created)
          headers:
            X-Reason:
              schema:
                type: string
                example: INTERNAL_CHAT_MEMBERSHIP_FAILED
        503:
          description: >-
            SERVICE UNAVAILABLE - X-Reason INTERNAL_CHAT_ENCRYPTION_REQUIRED (end-to-end encryption is not enabled on this installation, so no private room is created)
            or INTERNAL_CHAT_BUSY (another request for the same people is still being processed, or the members of the existing room could not be read; try again)
          headers:
            X-Reason:
              schema:
                type: string
                example: INTERNAL_CHAT_ENCRYPTION_REQUIRED
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: [ ]
