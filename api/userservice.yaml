      tags: [chat-series-controller]
      operationId: createChatSeriesJoinRequest
      summary: Knock to join a self-help group via its invite link
      description: >-
        Any consultant holding the invite link may knock. The response carries only the request
        status, never any group data. A second knock while a request is pending returns the
        pending request. Check order: unknown Series or missing/wrong inviteToken → 403 (the two
        are indistinguishable); then not a self-help group → 400; then caller already has
        access → 409.
      security:
        - Bearer: [ ]
      parameters:
        - name: seriesId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: inviteToken
          in: query
          description: Secret part of the invite link (same value as for /users/chat/{id}/assign).
          required: false
          schema: { type: string }
      responses:
        '200':
          description: A pending request of the caller already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupChatJoinRequestStatusDTO' }
        '201':
          description: Join request created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupChatJoinRequestStatusDTO' }
        '400': { description: The Series is not a self-help group (only after the token matched) }
        '401': { description: UNAUTHORIZED - no/invalid Keycloak token }
        '403': { description: "Unknown Series, missing or wrong inviteToken, or caller is not a consultant" }
        '409': { description: Caller already has access to this Series }
  /users/chat-series/{seriesId}/join-requests/mine:
    get:
      tags: [chat-series-controller]
      operationId: getOwnChatSeriesJoinRequest
      summary: Returns the caller's newest join request for this Series
      security:
        - Bearer: [ ]
      parameters:
        - name: seriesId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: The caller's newest join request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupChatJoinRequestStatusDTO' }
        '204': { description: The caller never knocked on this Series }
        '401': { description: UNAUTHORIZED - no/invalid Keycloak token }
        '403': { description: Caller is not a consultant }
    delete:
      tags: [chat-series-controller]
      operationId: cancelOwnChatSeriesJoinRequest
      summary: Cancels the caller's pending join request (idempotent)
      security:
        - Bearer: [ ]
      parameters:
        - name: seriesId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: No pending request remains }
        '401': { description: UNAUTHORIZED - no/invalid Keycloak token }
        '403': { description: Caller is not a consultant }
        '409': { description: Admission is already being completed }
  /users/chat-series/join-requests:
    get:
      tags: [chat-series-controller]
      operationId: getPendingChatSeriesJoinRequests
      summary: Pending join requests of every Series the caller owns or co-moderates
      security:
        - Bearer: [ ]
      responses:
        '200':
          description: Pending requests awaiting a moderator decision, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GroupChatJoinRequestDTO' }
        '401': { description: UNAUTHORIZED - no/invalid Keycloak token }
        '403': { description: Caller is not a consultant }
  /users/chat-series/{seriesId}/join-requests/{requestId}/admit:
    post:
      tags: [chat-series-controller]
      operationId: admitChatSeriesJoinRequest
      summary: Accepts an admission decision as Participant or Co-Moderator
      security:
        - Bearer: [ ]
      parameters:
        - name: seriesId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: requestId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupChatJoinRequestAdmitDTO' }
      responses:
        '204': { description: Admission accepted; Matrix join may still be pending and will be retried }
        '400': { description: "Not a self-help group, or Co-Moderator requested for a consultant of another tenant" }
        '401': { description: UNAUTHORIZED - no/invalid Keycloak token }
        '403': { description: Caller may not admit (or may not grant Co-Moderator) }
        '404': { description: Unknown join request for this Series }
        '409': { description: Join request is not pending or admission is already being completed }
  /users/chat-series/{seriesId}/join-requests/{requestId}/decline:
    post:
      tags: [chat-series-controller]
      operationId: declineChatSeriesJoinRequest
      summary: Declines a pending join request
      security:
        - Bearer: [ ]
      parameters:
        - name: seriesId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: requestId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Join request declined }
        '400': { description: The Series is not a self-help group }
        '401': { description: UNAUTHORIZED - no/invalid Keycloak token }
        '403': { description: Caller may not decline }
        '404': { description: Unknown join request for this Series }
        '409': { description: Join request is not pending or admission is already being completed }

components:
  schemas:
    ServiceNoticeDraftInput:
      type: object
      required: [maintenanceDate, maintenanceStart, maintenanceEnd, statusUrl]
      properties:
        maintenanceDate: { type: string, format: date }
        maintenanceStart: { type: string, description: Same-day local time in whole minutes, example: '14:00:00' }
        maintenanceEnd: { type: string, description: Same-day local time in whole minutes, example: '15:00:00' }
        statusUrl: { type: string, format: uri, description: Explicit public HTTPS status page }
    ServiceNoticeDraftView:
      type: object
      required: [campaignKey, status, maintenanceDate, maintenanceStart, maintenanceEnd, statusUrl]
      properties:
        campaignKey: { type: string }
        status: { type: string, x-extensible-enum: [DRAFT, CONFIRMED] }
        maintenanceDate: { type: string, format: date }
        maintenanceStart: { type: string }
        maintenanceEnd: { type: string }
        statusUrl: { type: string, format: uri }
    ServiceNoticeDraftPreview:
      type: object
      required: [campaignKey, variant, subject, preheader, html, text]
      properties:
        campaignKey: { type: string }
        variant: { type: string, enum: [de-sie, de-du, en, fr, ru, ti, tr] }
        subject: { type: string }
        preheader: { type: string }
        html: { type: string }
        text: { type: string }
    ServiceNoticeDryRun:
      type: object
      required: [campaignKey, audience, recipients, mail, feedOnlyPreferenceOff, feedOnlyNoAddress, feedOnlyNoSenderTenant]
      properties:
        campaignKey: { type: string }
        audience: { type: string, enum: [AGENCY_ADMINS] }
        recipients: { type: integer, description: Everyone who would get the in-app entry }
        mail: { type: integer, description: Recipients who would also get the mail }
        feedOnlyPreferenceOff: { type: integer, description: In-app only because their service-notice switch is off }
        feedOnlyNoAddress: { type: integer, description: In-app only because no real address is stored }
        feedOnlyNoSenderTenant: { type: integer, description: In-app only because no sender tenant is known }
    ServiceNoticeConfirmRequest:
      type: object
      required: [expectedRecipients]
      properties:
        expectedRecipients: { type: integer, minimum: 0, description: The recipients count shown by the dry run }
    ServiceNoticeConfirmed:
      type: object
      required: [campaignKey, status, recipients, mailQueued, alreadyConfirmed]
      properties:
        campaignKey: { type: string }
        status: { type: string, enum: [CONFIRMED] }
        recipients: { type: integer }
        mailQueued: { type: integer }
        alreadyConfirmed: { type: boolean }
    GuestIdentitySuggestionRequest:
      type: object
      required: [locale, count, exclude]
      properties:
        locale: {type: string, minLength: 2, maxLength: 20}
        count: {type: integer, enum: [1, 4]}
        exclude:
          type: array
          maxItems: 20
          items: {type: string, pattern: '^[a-z0-9_]{3,30}$'}
    GuestIdentitySuggestion:
      type: object
      required: [username, displayName, avatarKey]
      properties:
        username: {type: string, pattern: '^[a-z0-9_]{3,30}$'}
        displayName: {type: string}
        avatarKey:
          type: string
          description: Existing bundled animal SVG filename, never an external URL
    GuestInvitationContext:
      type: object
      required: [tenantId, consultingTypeId, chatType]
      properties:
        tenantId: {type: integer, format: int64}
        agencyId: {type: integer, format: int64, nullable: true}
        consultingTypeId: {type: integer, format: int32}
        topicId: {type: integer, format: int64, nullable: true}
        chatType: {type: string}
        temporaryAccount:
          type: boolean
          nullable: true
          description: Direct links only. New people get a temporary account (ADR-029 §3).
        admission:
          type: string
          nullable: true
          enum: [DIRECT, KNOCK]
          description: Direct links only. KNOCK for audio and video, DIRECT for chat (ADR-029 §2).
        hidePasswordField:
          type: boolean
          nullable: true
          description: >-
            Links with temporaryAccount only. The platform hides the password field; the app then
            sends a suggested password silently. The account always has one (ADR-029 §3).
        messageRetention:
          type: string
          nullable: true
          enum: [ALWAYS_TEMPORARY, GUEST_DECIDES, ALWAYS_PERSISTENT]
          description: Links with temporaryAccount only. The mode a person joining now gets (§5).
    DirectLinkMedium:
      type: string
      enum: [CHAT, AUDIO, VIDEO]
    DirectLinkDTO:
      type: object
      required: [id, token, url, medium, topicId, temporary, active, admission]
      properties:
        id: {type: integer, format: int64}
        token: {type: string}
        url:
          type: string
          description: Shareable entry URL (APP_BASE_URL + /invite/{token}; relative when the base is unset)
        name: {type: string, maxLength: 100}
        topicId: {type: integer, format: int64}
        topicName: {type: string}
        agencyId: {type: integer, format: int64}
        medium: {$ref: '#/components/schemas/DirectLinkMedium'}
        temporary: {type: boolean}
        active: {type: boolean}
        admission: {type: string, enum: [DIRECT, KNOCK]}
        createDate: {type: string, format: date-time}
    CreateDirectLinkDTO:
      type: object
      required: [medium, topicId]
      properties:
        medium: {$ref: '#/components/schemas/DirectLinkMedium'}
        topicId: {type: integer, format: int64}
        name: {type: string, maxLength: 100}
        temporary:
          type: boolean
          description: Defaults to false for chat and true for calls
        agencyId:
          type: integer
          format: int64
          description: Required only when the caller works for more than one Beratungsstelle
    UpdateDirectLinkDTO:
      type: object
      description: Every field is optional; absent fields stay unchanged
      properties:
        name: {type: string, maxLength: 100}
        topicId: {type: integer, format: int64}
        temporary: {type: boolean}
        active: {type: boolean}
    DirectLinkConversationDTO:
      type: object
      required: [sessionId, medium, admission, created]
      properties:
        sessionId: {type: integer, format: int64}
        matrixRoomId: {type: string}
        medium: {$ref: '#/components/schemas/DirectLinkMedium'}
        admission: {type: string, enum: [DIRECT, KNOCK]}
        created: {type: boolean}
        knockId:
          type: integer
          format: int64
          description: 'Audio and video only. The person''s admission, else their open knock; poll GET /users/call-knocks/mine/{knockId}.'
        knockStatus: {$ref: '#/components/schemas/CallKnockStatus'}
        callAdmitted:
          type: boolean
          description: 'Audio and video only. True once the counsellor let the person in: the admission holds for the whole conversation, so later calls are joined directly and no new knock is opened.'
    CallKnockStatus:
      type: string
      enum: [PENDING, ADMITTED, DECLINED, CANCELLED]
    CallKnockDTO:
      type: object
      required: [id, status, medium, requestedAt]
      properties:
        id: {type: integer, format: int64}
        sessionId:
          type: integer
          format: int64
          description: 'The conversation whose call is knocked on; empty for a call share link knock of a call without a 1:1 conversation (#1487).'
        callShareLinkId:
          type: integer
          format: int64
          description: 'Set when the guest knocked through the share link of a running call (#1487); the id returned by POST /matrix/calls/share-links.'
        displayName:
          type: string
          description: 'The knocking person''s username (pseudonym), decoded; never the e-mail address or a real name.'
        status: {$ref: '#/components/schemas/CallKnockStatus'}
        medium: {$ref: '#/components/schemas/DirectLinkMedium'}
        requestedAt: {type: string, format: date-time}
        decidedAt: {type: string, format: date-time}
    OccurrenceOverrideRequest:
      type: object
      required: [originalStartUtc]
      properties:
        originalStartUtc: { type: string, format: date-time }
        overrideStartUtc: { type: string, format: date-time }
        duration: { type: integer, minimum: 1 }
        capacity: { type: integer, minimum: 1 }
        modality: { type: string, enum: [TEXT, AUDIO, VIDEO] }
    RoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [OWNER, CO_MODERATOR, PARTICIPANT] }
    TransferOwnershipRequest:
      type: object
      required: [consultantId]
      properties:
        consultantId: { type: string }
    GroupChatJoinRequestStatusDTO:
      type: object
      description: Requester view of a join request. Deliberately carries no group data.
      required: [id, status, requestedAt]
      properties:
        id: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/GroupChatJoinRequestStatus' }
        requestedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
    GroupChatJoinRequestStatus:
      type: string
      enum: [PENDING, ADMITTING, ADMITTED, DECLINED, CANCELLED]
    GroupChatJoinRequestDTO:
      type: object
      description: Moderator view of a pending join request.
      required: [id, seriesId, status, requestedAt, via, viewerRole, requester]
      properties:
        id: { type: integer, format: int64 }
        seriesId: { type: integer, format: int64 }
        groupTitle: { type: string }
        status: { $ref: '#/components/schemas/GroupChatJoinRequestStatus' }
        requestedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
        via: { type: string, enum: [INVITE_LINK] }
        viewerRole:
          type: string
          enum: [OWNER, CO_MODERATOR]
          description: >-
            The caller's own role in this Series. Only an OWNER may admit as CO_MODERATOR.
        requester: { $ref: '#/components/schemas/GroupChatJoinRequesterDTO' }
    GroupChatJoinRequesterDTO:
      type: object
      required: [consultantId, sameAgency, sameTenant]
      properties:
        consultantId: { type: string }
        displayName: { type: string, nullable: true }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        agencyName: { type: string, nullable: true }
        tenantName: { type: string, nullable: true }
        sameAgency: { type: boolean }
        sameTenant: { type: boolean }
    GroupChatJoinRequestAdmitDTO:
      type: object
      properties:
        role:
          type: string
          enum: [PARTICIPANT, CO_MODERATOR]
          default: PARTICIPANT
    UserDTO:
      allOf:
        - $ref: '#/components/schemas/SessionDataDTO'
      type: object
      required:
        - username
        - postcode
        - agencyId
        - password
        - termsAccepted
        - consultingType
      properties:
        username:
          type: string
          example: max94
        postcode:
          type: string
          minLength: 1
          maxLength: 5
          example: 79098
        agencyId:
          type: integer
          format: int64
          example: 15
        password:
          type: string
          format: password
          example: pass@w0rd
        termsAccepted:
          type: string
          example: true
        consultingType:
          type: string
          example: 3
        consultantId:
          type: string
          description: UUID
        temporary:
          type: boolean
          description: >-
            "Join without an account" from a self-help group invite link. The browser holds the
            only login, so the account is deleted once no login can still be alive
            (`user.temporary.deleteWorkflow.maxAge`, default 24 hours). Default false.
          example: false
        mainTopicId:
          type: integer
          example: 15
        topicIds:
          type: array
          items:
            type: integer
          example: [12,15]
        counsellingRelation:
          type: string
          example: 'SELF_COUNSELLING'
        gender:
          type: string
          example: 'DIVERSE'
        preferredLanguage:
          $ref: "#/components/schemas/LanguageCode"
        groupChatId:
          type: integer
          format: int64
          description: >-
            Self-help group the person joins through its invite link. When set, the
            registration assigns that group and opens no counselling enquiry. It must be a
            self-help group of `agencyId`, it needs `groupChatInviteToken`, and it cannot be
            combined with `consultantId`.
          example: 19
        groupChatInviteToken:
          type: string
          description: >-
            The secret part of that group's invite link. Required with `groupChatId`; a missing
            or wrong token answers 403 before any account is created, the same check as joining
            by invite link.
        directLinkToken:
          type: string
          description: >-
            Token of the counsellor direct link that creates this temporary account (ADR-029 §3).
            Requires `temporary: true` and a link with `temporaryAccount`. The account copies the
            platform lifetimes and retention mode (`/users/admin/temporary-account-settings`) and
            opens no enquiry; the conversation starts with `POST /users/invitelinks/{token}/conversations`.


    SessionDataDTO:
      type: object
      properties:
        displayName:
          type: string
          example: Behutsames Pferd Jules
          description: Session-scoped pseudonym shown to consultants for anonymous live chat
        age:
          type: string
          example: 17
          description: mandatory depending on the consulting type
        state:
          type: string
          example: 8
          description: mandatory depending on the consulting type

    ConsultantSessionListResponseDTO:
      type: object
      required:
        - sessions
        - offset
        - count
        - total
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/ConsultantSessionResponseDTO'
        offset:
          type: integer
          description: Session value where to start from in the query (0 = first item)
        count:
          type: integer
          description: Number of sessions which are being returned
        total:
          type: integer
          description: Total amount of sessions the consultant has

    ConsultantSessionResponseDTO:
      type: object
      required:
        - SessionDTO
        - UserChatDTO
      properties:
        session:
          $ref: '#/components/schemas/SessionDTO'
        chat:
          $ref: '#/components/schemas/UserChatDTO'
        user:
          $ref: '#/components/schemas/SessionUserDTO'
        consultant:
          $ref: '#/components/schemas/SessionConsultantForConsultantDTO'
        agency:
          $ref: '#/components/schemas/AgencyDTO'
        latestMessage:
          $ref: '#/components/schemas/Date'

    GroupSessionListResponseDTO:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/GroupSessionResponseDTO'

    GroupSessionResponseDTO:
      type: object
      required:
        - SessionDTO
        - UserChatDTO
      properties:
        session:
          $ref: '#/components/schemas/SessionDTO'
        chat:
          $ref: '#/components/schemas/UserChatDTO'
        user:
          $ref: '#/components/schemas/SessionUserDTO'
        consultant:
          $ref: '#/components/schemas/GroupSessionConsultantDTO'
        agency:
          $ref: '#/components/schemas/AgencyDTO'
        latestMessage:
          $ref: '#/components/schemas/Date'

    GroupSessionConsultantDTO:
      type: object
      properties:
        id:
          type: string
          example: 153918
        username:
          type: string
          example: beraterXYZ
        displayName:
          type: string
        isAbsent:
          type: boolean
          example: true
        absenceMessage:
          type: string
          example: Bin nicht da
        firstName:
          type: string
          example: Max
        lastName:
          type: string
          example: Mustermann
        avatarKind:
          type: string
          enum: [ICON, INITIALS, PICTURE]
          description: >-
            The counsellor's chosen avatar (#1046/#1047), so the advice seeker sees the same
            avatar in the chat that the counsellor picked. Absent when no choice was made and the
            derived animal default is rendered.
        avatarId:
          type: string
          maxLength: 64
          example: "motif-24"
          description: Id of the chosen counsellor motif; only set together with avatarKind = ICON.

    Date:
      type: object
      writeOnly: true

    ConversationType:
      type: string
      enum: [AGENCY_COUNSELLING, LIVE_CHAT, INTERNAL_GROUP, SELF_HELP]

    SessionDTO:
      type: object
      required:
        - id
        - agencyId
        - consultingType
        - status
        - registrationType
      properties:
        id:
          type: integer
          format: int64
          example: 153918
        agencyId:
          type: integer
          format: int64
          example: 100
        consultingType:
          type: integer
          example: 1
        status:
          type: integer
          example: 0
          description: "0 = INITIAL, 1 = NEW, 2 = IN PROGRESS, 3 = DONE, 4 = IN ARCHIVE, 5 = REJECTED"
        conversationType:
          allOf:
            - $ref: '#/components/schemas/ConversationType'
          nullable: true
          example: LIVE_CHAT
          description: Stable ADR-006 modality. One of AGENCY_COUNSELLING, LIVE_CHAT, INTERNAL_GROUP, SELF_HELP.
        postcode:
          type: string
          minLength: 1
          maxLength: 5
          example: 79098
        language:
          $ref: '#/components/schemas/LanguageCode'
        matrixRoomId:
          type: string
          example: "!aBcDeF123:91.99.219.182"
          description: Matrix Synapse room ID
        askerMatrixUserId:
          type: string
          example: "@asker:matrix.example"
          description: Matrix user ID of the asker
        consultantMatrixUserId:
          type: string
          nullable: true
          example: "@consultant:matrix.example"
          description: Matrix user id of the assigned consultant (null when no consultant is assigned)
        e2eLastMessage:
          $ref: '#/components/schemas/LastMessageDTO'
        lastMessage:
          type: string
        lastMessageType:
          $ref: '#/components/schemas/MessageType'
        messageDate:
          type: integer
          format: int64
          example: 1539184948
        messagesRead:
          type: boolean
          example: false
        isTeamSession:
          type: boolean
          example: false
        isTopicDuplicate:
          type: boolean
          description: >-
            FE#1876, asker session list only: this accepted conversation is the newer of two on
            the same topic, so the asker may end it (PUT /users/askers/sessions/{id}/end-duplicate).
          example: false
        registrationType:
          type: string
          example: ANONYMOUS
        createDate:
          type: string
          example: 2021-05-11T15:29:37
        attachment:
          $ref: '#/components/schemas/SessionAttachmentDTO'
        videoCallMessageDTO:
          $ref: '#/components/schemas/VideoCallMessageDTO'
        topic:
          $ref: '#/components/schemas/SessionTopicDTO'
        consentedLegalVersionId:
          type: integer
          format: int64
          example: 7
          description: >-
            ADR-022 decision 2 - the legal-text version (owned by ORISO-AgencyService) this room is
            currently cleared for; null when Gate 2 has not been passed. A pointer, overwritten on
            re-consent, never a consent log. Additive - older clients can ignore it.
        consentRequired:
          type: boolean
          example: false
          description: >-
            true when Gate 2 applies to this session and no consent pointer is recorded, i.e. the
            client must show the consent gate instead of the composer. Internal rooms (no
            help-seeker) always report false. Additive - older clients can ignore it.
        supervision:
          $ref: '#/components/schemas/SessionSupervisionDTO'

    SessionSupervisionDTO:
      type: object
      description: >-
        ADR-008 supervision marker for consultant-facing session lists. Filled for the requesting
        consultant only; absent on advice-seeker responses. Additive - older clients can ignore it.
      required:
        - supervisedByMe
        - supervisorConsultantIds
        - supervisorDisplayNames
      properties:
        supervisedByMe:
          type: boolean
          example: true
          description: >-
            true when the requesting consultant is an active SessionSupervisor of this session,
            i.e. the entry is in their list because they supervise it, not because they counsel it.
        supervisorConsultantIds:
          type: array
          items:
            type: string
          example: ["926b9777-4eef-443d-925a-4aa534797bd7"]
          description: Keycloak ids of all active supervisors of this session (empty when none).
        supervisorDisplayNames:
          type: array
          items:
            type: string
          example: ["Supervisor Sam"]
          description: >-
            Internal display names of the active supervisors, same order as
            supervisorConsultantIds (internal display name, else public display name, else
            username). Never a real name.
        counsellorDisplayName:
          type: string
          nullable: true
          example: "Counsellor Chris"
          description: >-
            Internal display name of the session's assigned (responsible) consultant, resolved by
            the same #996 rule as supervisorDisplayNames (internal display name, else public display
            name, else username). Never a real name. Absent when the session has no consultant yet
            (enquiry not taken). Lets a supervisor's panel title the case by its counsellor without
            a second lookup.
        sideRoomId:
          type: string
          nullable: true
          example: "!supervision-side-room:matrix.example.org"
          description: >-
            Matrix room id of the private ADR-008 supervision back-channel. Returned only when the
            requesting consultant is the session's assigned counsellor or an active supervisor.
            Never contains the help-seeker room id; null for unrelated team-list viewers, legacy
            rows that stored the client room, missing rooms, or inconsistent active assignments.

    CaseHandoverConsentPreferenceUpdateDTO:
      type: object
      required: [alwaysAskBeforeAdditionalAccess]
      properties:
        alwaysAskBeforeAdditionalAccess:
          type: boolean
          nullable: false
          description: Ask before future allowed additional access; not approval of a current request
    CaseHandoverConsentPreferenceDTO:
      type: object
      required: [sessionId, alwaysAskBeforeAdditionalAccess]
      properties:
        sessionId:
          type: integer
          format: int64
        alwaysAskBeforeAdditionalAccess:
          type: boolean
          nullable: false
          description: Stored per-conversation preference; defaults to false
    SessionSupervisorResponseDTO:
      type: object
      description: An active supervision assignment for a session.
      required:
        - id
        - sessionId
        - supervisorConsultantId
        - supervisorUsername
        - addedByConsultantId
        - addedDate
      properties:
        id:
          type: integer
          format: int64
        sessionId:
          type: integer
          format: int64
