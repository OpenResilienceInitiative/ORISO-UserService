  /users/admin/service-notices/drafts/{campaignKey}/dry-run:
    get:
      tags: [service-notice-dry-run-controller]
      operationId: dryRunServiceNoticeDraft
      summary: Count who a planned notice would reach, without recording or sending anything
      description: >-
        Implemented by the handwritten platform-administrator controller; the /service-prefixed
