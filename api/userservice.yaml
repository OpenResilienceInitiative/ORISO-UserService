          type: boolean
          example: true
          description: Flag that indicates if the consultant can be added as a supervisor
        absent:
          type: boolean
          example: true
          description: Flag that indicates if the consultant is currently absent
        absenceMessage:
          type: string
          nullable: true
          example: I am absent until...
          description: The out-of-office message; carries a value only while absent is true, otherwise null
        agencies:
          type: array
          items:
            $ref: './../services/agencyservice.yaml#/components/schemas/AgencyResponseDTO'

    PasswordDTO:
      type: object
      required:
        - oldPassword
        - newPassword
      properties:
        oldPassword:
          type: string
          format: password
          example: oldpass@w0rd
        newPassword:
          type: string
          format: password
          example: newpass@w0rd

    ChatDTO:
      type: object
      required:
        - topic
        - startDate
        - startTime
        - duration
        - repetitive
      properties:
        topic:
          type: string
          example: Wöchentliche Drogenberatung
        agencyId:
          type: integer
          format: int64
          example: 7
        startDate:
          type: string
          format: date
          example: 2019-10-23
        startTime:
          type: string
          format: time
          example: 12:05
          description: Wall-clock start time in `timezone`; stored as a UTC instant.
        duration:
          type: integer
          example: 120
        repetitive:
          type: boolean
          example: false
        repeatCount:
          type: integer
          minimum: 1
          maximum: 365
          default: 1
        chatInterval:
          type: string
          enum: [DAILY, WEEKLY, BIWEEKLY, MONTHLY, QUARTERLY, YEARLY]
        modality:
          type: string
          enum: [TEXT, AUDIO, VIDEO]
          default: TEXT
        timezone:
          type: string
          example: Europe/Berlin
          default: UTC
        hintMessage:
          type: string
          example: "Hint"
          maxLength: 300
        sourceLanguage:
          type: string
          example: de
          maxLength: 10
        hintMessageTranslations:
          type: object
          additionalProperties:
            type: string
            maxLength: 120
        groupChatRulesTranslations:
          type: object
          additionalProperties:
            type: array
            maxItems: 10
            items:
              type: string
              maxLength: 120

    InternalSubsetChatDTO:
      type: object
      required:
        - consultantIds
      properties:
        consultantIds:
          type: array
          description: The colleagues to talk to (the caller is added automatically and is ignored if listed).
          minItems: 1
          maxItems: 50
          items:
            type: string
          example: ["consultant-id-1"]
        agencyId:
          type: integer
          format: int64
          description: The counselling centre the chat belongs to. Defaults to the lowest-numbered centre of the caller that the whole selection is within the recipient scope for.
          example: 5
        topic:
          type: string
          minLength: 3
          maxLength: 50
          description: Name of the room. Defaults to the members' names.
          example: Case talk
    AgencyAdminContactDTO:
      type: object
      required:
        - consultantId
        - displayName
      properties:
        consultantId:
          type: string
          description: Id to pass in consultantIds of POST /users/chat/internal-subset.
          example: "consultant-id-1"
        displayName:
          type: string
          example: "Maria Muster"
    InternalSubsetChatResponseDTO:
      type: object
      required:
        - matrixRoomId
        - chatId
      properties:
        matrixRoomId:
          type: string
          example: "!abc:matrix.example.org"
        chatId:
          type: integer
          format: int64
          example: 42
    CreateChatResponseDTO:
      type: object
      required:
        - matrixRoomId
      properties:
        createdAt:
          type: string
          format: time
          example: 2019-10-23T12:05:00.000Z
        creatorDisplayName:
          type: string
          example: Max M.
        matrixRoomId:
          type: string
          example: "!aBcDeF123:matrix.example"

    ChatInfoResponseDTO:
      type: object
      required:
        - id
        - matrixRoomId
        - active
      properties:
        id:
          type: integer
          format: int64
          example: 153918
        matrixRoomId:
          type: string
          example: "!aBcDeF123:matrix.example"
        active:
          type: boolean
          example: false
        bannedUsers:
          type: array
          description: usernames
          items:
            type: string

    ChatMembersResponseDTO:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/ChatMemberResponseDTO"

    ChatMemberResponseDTO:
      type: object
      properties:
        _id:
          type: string
        status:
          type: string
        username:
          type: string
        displayName:
          type: string
        utcOffset:
          type: string
        userId:
          type: string
        avatarKind:
          type: string
          description: Stored counsellor avatar kind; absent for advice seekers or when unset.
        avatarId:
          type: string
          description: Stored animal or motif id. Absent kind and id select the derived default; INITIALS has no motif id.

    UpdateChatResponseDTO:
      type: object
      required:
        - matrixRoomId
      properties:
        matrixRoomId:
          type: string
          example: "!aBcDeF123:matrix.example"

    NewRegistrationDto:
      type: object
      required:
        - postcode
        - agencyId
        - consultingType
      properties:
        postcode:
          type: string
          minLength: 1
          maxLength: 5
          example: 79098
        agencyId:
          type: integer
          format: int64
          example: 232
        consultingType:
          type: string
          example: 1
        consultantId:
          type: string
          description: used for direct consultant registration
        age:
          type: string
          example: 12
        gender:
          type: string
          example: 'DIVERSE'
        topicIds:
          type: array
          items:
            type: integer
            format: int64
          example: [ 12,15 ]
        mainTopicId:
          type: integer
          example: 15
        counsellingRelation:
          type: string
          example: 'SELF_COUNSELLING'
        referer:
          type: string
          pattern: "^[a-zA-Z0-9]{1,8}$"
          maxLength: 8
          example: '12345678'


    NewRegistrationResponseDto:
      type: object
      properties:
        sessionId:
          type: integer
          format: int64
        matrixRoomId:
          type: string
        status:
          $ref: "#/components/schemas/HttpStatus"

    HttpStatus:
      type: object
      writeOnly: true

    MasterKeyDTO:
      type: object
      required:
        - masterKey
      properties:
        masterKey:
          type: string
          example: "sdj8wnFNASj324!ksldf9"

    ReassignmentNotificationDTO:
      type: object
      required:
        - matrixRoomId
        - toConsultantId
      properties:
        matrixRoomId:
          type: string
          example: "!aBcDeF123:matrix.example"
        toConsultantId:
          type: string
          format: UUID
        fromConsultantName:
          type: string
        isConfirmed:
          type: boolean
          description: null defines the reassign request

    DeleteUserAccountDTO:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          format: password
          example: p@ssw0rd

    EmailDTO:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: max.mustermann@domain.de

    OneTimePasswordDTO:
      type: object
      required:
        - secret
        - otp
      properties:
        secret:
          type: string
          format: password
          minLength: 32
          maxLength: 32
        otp:
          type: string
          format: password
          minLength: 6
          maxLength: 6

    TwoFactorAuthDTO:
      type: object
      required:
        - isEnabled
        - isActive
      properties:
        isEnabled:
          type: boolean
          example: true
          default: false
        isActive:
          type: boolean
          example: true
          default: false
        secret:
          type: string
          format: password
        qrCode:
          type: string
        type:
          $ref: "#/components/schemas/OtpType"
        isToEncourage:
          type: boolean
          example: true
          default: true
          nullable: false
          description: indicates if 2FA is supposed to be encouraged
        isRequired:
          type: boolean
          example: true
          default: false
          nullable: false
          description: >-
            indicates that the account may not be used until a second factor is
            active. Set for counsellors whose login was provisioned by an
            administrator, who chooses the initial password and hands it over.

    EmailNotificationsDTO:
      type: object
      required:
        - emailNotificationsEnabled
      properties:
        emailNotificationsEnabled:
          type: boolean
          example: true
          default: false
        settings:
           $ref: "#/components/schemas/NotificationsSettingsDTO"

    NotificationsSettingsDTO:
      type: object
      properties:
        initialEnquiryNotificationEnabled:
          type: boolean
          example: true
          default: false
        newChatMessageNotificationEnabled:
          type: boolean
          example: true
          default: false
        reassignmentNotificationEnabled:
          type: boolean
          example: true
          default: false
        appointmentNotificationEnabled:
          type: boolean
          example: true
          default: false
        # Added for the notification matrix (ADR-019 in ORISO-Frontend).
        # These live in the same JSON blob as the four above, so there is no
        # schema migration behind them.
        assignmentNotificationEnabled:
          type: boolean
          description: >-
            Counsellor: an enquiry was assigned to me.
          example: true
          # On unless the recipient switches it off: ADR-019 makes these
          # switchable, not opt-in. A counsellor who never opens the settings
          # screen still gets their work queue.
          default: true
        internalChatNotificationEnabled:
          type: boolean
          description: >-
            Counsellor: a new ordinary internal-group message. Independent of
            advice-seeker messages and protected professional feedback. Omitted
            legacy values mean enabled; an omitted PATCH preserves the saved choice.
          example: true
        feedbackNotificationEnabled:
          type: boolean
          description: >-
            Counsellor: a reply arrived in the protected professional exchange.
          example: true
          # On unless the recipient switches it off: ADR-019 makes these
          # switchable, not opt-in. A counsellor who never opens the settings
          # screen still gets their work queue.
          default: true
        serviceNoticeNotificationEnabled:
          type: boolean
          description: >-
            Both roles: maintenance and platform notices. Outages are sent
            regardless — this switches off the planned ones only.
          example: true
          # On unless the recipient switches it off: ADR-019 makes these
          # switchable, not opt-in. A counsellor who never opens the settings
          # screen still gets their work queue.
          default: true

    OtpType:
      type: string
      enum:
        - EMAIL
        - APP

    EmailToggle:
      type: object
      required:
        - name
        - state
      properties:
        name:
          $ref: '#/components/schemas/EmailType'
        state:
          type: boolean
          nullable: false

    EmailType:
      type: string
      enum:
        - DAILY_ENQUIRY
        - NEW_CHAT_MESSAGE_FROM_ADVICE_SEEKER

  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
