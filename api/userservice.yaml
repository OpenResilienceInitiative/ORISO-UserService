      summary: Read the owning advice seeker's saved future additional-access preference
      description: >-
        Agency counselling only. Also available with /service prefix. This choice is separate
        from approval of an individual request. Owner and tenant checks apply.
      operationId: getCaseHandoverConsentPreference
      # Dedicated handwritten controller owns both prefixes; prevent a duplicate UsersApi mapping.
      x-internal: true
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Saved preference; false retains the centre's existing consent policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseHandoverConsentPreferenceDTO'
        '401':
          description: Authentication required
        '403':
          description: Not the registered owning advice seeker, wrong tenant or unsupported modality
        '404':
          description: Session does not exist
      security:
        - Bearer: []
    put:
      tags: [case-handover-controller]
      summary: Save the owning advice seeker's preference to ask before future additional access
      description: >-
        Also available with /service prefix. True strengthens allowed future requests to opt-in;
        false restores the centre's baseline and never weakens its opt-in requirement.
        Existing individual requests, grants and ownership remain unchanged.
      operationId: updateCaseHandoverConsentPreference
      x-internal: true
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseHandoverConsentPreferenceUpdateDTO'
      responses:
        '200':
          description: Persisted preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseHandoverConsentPreferenceDTO'
        '400':
          description: Missing or invalid boolean choice
        '401':
          description: Authentication required
        '403':
          description: Not the registered owning advice seeker, wrong tenant, unsupported modality or invalid CSRF token
        '404':
          description: Session does not exist
      security:
        - Bearer: []
  /users/sessions/{sessionId}/case-handover/{requestId}:
    get:
      tags: [case-handover-controller]
      summary: Read the current status of one case handover request
      description: >-
        Also available with /service prefix. Open to the request's counsellor parties and to the
        registered advice seeker who owns the session; the response differs by role.
        Consultant: the full request status, including direction, initiator and recipient ids,
        reason code and label, operation id and expected ownership revision (unchanged).
        Advice seeker (#1705): only the client-safe view (requestId, sessionId, status,
        canViewContent, clientConsent, clientConsentRequired, ownershipRevision, auditOutcome,
        createdAt, resolvedAt, accessType, expiresAt), never counsellor identity, reason or
        explanation. The advice seeker gets the real status of a request they were asked about,
        including a final one (GRANTED, CLIENT_CONSENT_DECLINED, EXPIRED), so a consent prompt that
        is no longer open can be settled instead of showing an error. Everything else answers 404:
        a request of another session or advice seeker or tenant, a colleague-to-colleague offer
        (PENDING_RECIPIENT_ACCEPTANCE, RECIPIENT_DECLINED, and WITHDRAWN before the colleague accepted), a DENIED request (denied before the
        advice seeker was asked, or their own decision, which the decision response carries) and a
        request without consent involvement. A request whose case owner changed after it was
        created keeps its stored status here; deciding it answers 409 with X-Reason
        CASE_OWNER_CHANGED.
      operationId: getCaseHandoverRequestStatus
      # Dedicated handwritten controller owns both prefixes; prevent a duplicate UsersApi mapping.
      x-internal: true
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: {type: integer, format: int64}
        - name: requestId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Current request status (consultant fields marked in the description are absent for an advice seeker)
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: {type: integer, format: int64}
                  sessionId: {type: integer, format: int64}
                  status:
                    type: string
                    description: >-
                      Existing CaseHandoverRequest status, or EXPIRED once the access window has
                      passed. An advice seeker never receives PENDING_RECIPIENT_ACCEPTANCE,
                      RECIPIENT_DECLINED or DENIED, and WITHDRAWN only once it had been asked for consent.
                    x-extensible-enum:
                      - PENDING
                      - PENDING_RECIPIENT_ACCEPTANCE
                      - RECIPIENT_DECLINED
                      - PENDING_CLIENT_CONSENT
                      - GRANTED_PENDING_CLIENT_OPTOUT
                      - GRANTED
                      - DENIED
                      - CLIENT_CONSENT_DECLINED
                      - EXPIRED
                      - RECLAIMED
                      - WITHDRAWN
                  canViewContent: {type: boolean}
                  clientConsent: {type: string, enum: [NONE, OPT_IN, OPT_OUT]}
                  clientConsentRequired: {type: boolean}
                  ownershipRevision: {type: integer, format: int64}
                  auditOutcome: {type: string}
                  accessType: {type: string, enum: [CO_ACCESS, TAKEOVER]}
                  createdAt: {type: string, format: date-time}
                  resolvedAt: {type: string, format: date-time, nullable: true}
                  expiresAt: {type: string, format: date-time, nullable: true}
                  direction: {type: string, enum: [PULL, PUSH], description: Consultant only}
                  initiatorConsultantId: {type: string, description: Consultant only}
                  recipientConsultantId: {type: string, description: Consultant only}
                  recipientDecisionAt: {type: string, format: date-time, nullable: true, description: Consultant only}
                  expectedOwnershipRevision: {type: integer, format: int64, nullable: true, description: Consultant only}
                  operationId: {type: string, format: uuid, description: Consultant only}
                  reasonCode: {type: string, description: Consultant only}
                  reasonLabel: {type: string, description: Consultant only}
                  policyAuthority: {type: string, description: Consultant only}
        '401':
          description: Authentication required
        '403':
          description: Role is neither consultant nor registered advice seeker
        '404':
          description: Request or session does not exist, or the caller may not read it (see description)
      security:
        - Bearer: []
  /users/sessions/{sessionId}/case-handover/{requestId}/withdraw:
    post:
      tags: [case-handover-controller]
      summary: The offering counsellor withdraws a colleague handover offer that is still open
      description: >-
        Also available with /service prefix. Only the counsellor who made the offer
        (initiator of a PUSH request) may withdraw it, and only while it is
        PENDING_RECIPIENT_ACCEPTANCE or PENDING_CLIENT_CONSENT. The request ends as WITHDRAWN
        (audit outcome OFFER_WITHDRAWN); ownership does not change. Idempotent: withdrawing a
        withdrawn offer answers 200 with the same status and notifies nobody again. Both
        counsellors get a case.handover.offer.withdrawn activity-timeline entry. Nothing is posted
        into the chat room, because a colleague offer is never shown to the advice seeker.
      operationId: withdrawCaseHandoverOffer
      # Dedicated handwritten controller owns both prefixes; prevent a duplicate UsersApi mapping.
      x-internal: true
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: {type: integer, format: int64}
        - name: requestId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: The offer is withdrawn; body is the case-handover status of the request
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Authentication required
        '403':
          description: The caller is not the counsellor who made this offer, or the request is not an offer
        '404':
          description: Session or request does not exist
        '409':
          description: The offer was already settled (accepted, declined, granted), so it cannot be withdrawn
      security:
        - Bearer: []
  /users/sessions/{sessionId}/case-handover/{requestId}/client-consent:
    post:
      tags: [case-handover-controller]
      summary: Decide a case handover request as the owning advice seeker
      description: >-
        Also available with /service prefix. Answers the request's client-safe status (see the GET
        of this request). An already resolved request is answered with its status, not an error.
      operationId: decideCaseHandoverClientConsent
      # Dedicated handwritten controller owns both prefixes; prevent a duplicate UsersApi mapping.
      x-internal: true
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: {type: integer, format: int64}
        - name: requestId
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approved: {type: boolean}
      responses:
        '200':
          description: Request status after the decision
        '401':
          description: Authentication required
        '403':
          description: Not the registered owning advice seeker, wrong tenant or invalid CSRF token
        '404':
          description: Request or session does not exist
        '409':
          description: >-
            The case owner changed after the request was created. Header X-Reason is
            CASE_OWNER_CHANGED; the request can no longer be decided. A 409 without that header is a
            transient conflict and the request may still be open.
      security:
        - Bearer: []
  /users/sessions/{sessionId}/supervisors:
    get:
      tags:
        - session-supervisor-controller
      summary: 'Returns all active supervisors of a session. [Authorization: Role: consultant]'
      operationId: getSessionSupervisors
      # The endpoint is implemented by the dedicated handwritten SessionSupervisorController.
      # Do not add its mapping to the generated UsersApi implemented by UserController as well.
      x-internal: true
      parameters:
        - name: sessionId
          in: path
          description: Session id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: OK - successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionSupervisorResponseDTO'
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - no/invalid role/authorization or CSRF token
        404:
          description: NOT FOUND - a session with such an ID does not exist
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: [ ]
  /users/sessions/{sessionId}/case-handover/reclaim:
    post:
      tags:
        - case-handover-controller
      summary: 'The counsellor a takeover moved the case away from takes it back (ADR-002 reclaim).
        The cover counsellor keeps their room membership and is re-hidden.
        [Authorization: Role: consultant]'
      operationId: reclaimCaseHandover
      # The endpoint is implemented by the dedicated handwritten CaseHandoverController.
      # Do not add its mapping to the generated UsersApi implemented by UserController as well.
      x-internal: true
      parameters:
        - name: sessionId
          in: path
          description: Session id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: OK - the caller owns the case again; body is the case-handover status of
            the session, as returned by GET /users/sessions/{sessionId}/case-handover
          content:
            application/json:
              schema:
                type: object
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - the caller is not the counsellor the latest granted takeover of
            this session moved the case away from
        404:
          description: NOT FOUND - a session with such an ID does not exist
        409:
          description: CONFLICT - the takeover was for a permanent reason (counsellor left,
            assignment ended), or the case has moved on from the cover counsellor since
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: [ ]
  /users/2fa/email:
    put:
      tags:
        - user-controller
      summary: 'Starts 2FA activation process by email [authorities: OTP-enabled user roles]'
      operationId: startTwoFactorAuthByEmailSetup
      requestBody:
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/EmailDTO'
        required: true
      responses:
        204:
          description: NO CONTENT - successful operation
        400:
          description: BAD REQUEST - invalid/incomplete request resp. provided password is wrong
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - no/invalid role/authorization or CSRF token
        409:
          description: CONFLICT - role from the request has no two factor auth enabled
        412:
          description: PRECONDITION FAILED - another user owns this email
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: [ ]
  /users/2fa/email/validate/{tan}:
    post:
      tags:
        - user-controller
      summary: 'Finishes 2FA activation process by email [authorities: OTP-enabled user roles]'
      operationId: finishTwoFactorAuthByEmailSetup
      parameters:
        - name: tan
          in: path
          required: true
          schema:
            type: string
            pattern: "[0-9]{6}"
      responses:
        204:
          description: NO CONTENT - successful operation
        400:
          description: BAD REQUEST - invalid/incomplete request resp. provided password is wrong
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - no/invalid role/authorization or CSRF token
        409:
          description: CONFLICT - role from the request has no two factor auth enabled
        412:
          description: PRECONDITION FAILED - already set up
        429:
          description: TOO MANY REQUESTS - maximum number of attempts has been reached
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
        503:
          description: SERVICE UNAVAILABLE - identity provider rejected the service session after one refresh; retry later
      security:
        - Bearer: [ ]
