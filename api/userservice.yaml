      summary: 'Records which legal-text version this counselling room is cleared for - Gate 2 of
        ADR-022. PUT, not POST: the pointer is overwritten on re-consent, so the call is idempotent
        and repeating it is not consenting twice. Nothing is appended and nothing about the person
        is stored. [Authorization: Role: anonymous or user]'
      operationId: recordSessionConsent
      parameters:
        - name: sessionId
          in: path
          description: Session Id
          required: true
          schema:
            type: integer
            format: int64
