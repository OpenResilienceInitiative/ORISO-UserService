          maxLength: 255
        formalLanguage:
          type: boolean
          example: true
        absent:
          type: boolean
          example: true
        absenceMessage:
          type: string
          example: "I am absent until..."
          minLength: 1
          maxLength: 10000
        languages:
          type: array
          items:
            type: string
            description: each an ISO 639-1 code
            example: de, en
        termsAndConditionsConfirmation:
          type: boolean
          example: true
          description: Flag that indicates has the user accepted new terms and conditions text
        dataPrivacyConfirmation:
          type: boolean
          example: true
          description: Flag that indicates does the user accepted new data privacy text
        isGroupchatConsultant:
          $ref: '#/components/schemas/IsGroupchatConsultant'
        isSupervisor:
          $ref: '#/components/schemas/IsSupervisor'
        assignedSupervisorId:
          $ref: '#/components/schemas/AssignedSupervisorId'
        topicIds:
          type: array
          description: replaces the full set of topics assigned to the consultant
          items:
            type: integer
            format: int64
          example: [3, 7, 12]
        publicSlug:
          type: string
          example: nikunj-rohit
          description: Optional public slug. Admin edits go live immediately; empty clears it.
        rejectPendingPublicSlug:
          type: boolean
          example: false
          description: If true, rejects the currently pending public slug without changing the active slug.
        displayName:
          type: string
          maxLength: 255
          description: >-
            The PUBLIC display name shown to advice seekers. Null leaves the stored value
            untouched; an empty string clears it.
        internalDisplayName:
          type: string
          maxLength: 255
          description: >-
            Optional internal display name for internal surfaces; internal contexts fall back to
            the public displayName when empty. Null leaves the stored value untouched; an empty
            string clears it.
        salutation:
          type: string
          maxLength: 64
          example: counsellor_female
          description: >-
            Stable salutation key chosen from the admin form option list. Null leaves the stored
            value untouched; an empty string clears it.
        position:
          type: string
          maxLength: 255
          example: "Head of counselling centre north"
          description: Null leaves the stored value untouched; an empty string clears it.
        title:
          type: string
          maxLength: 255
          example: "Dipl.-Soz.Päd."
          description: Null leaves the stored value untouched; an empty string clears it.
        adminRemarks:
          type: string
          maxLength: 10000
          description: >-
            Internal remarks about the consultant. Only readable and writable for tenant-level
            admins (tenant admin / platform admin); ignored for other callers. Null leaves the
            stored value untouched; an empty string clears it.
        avatarKind:
          type: string
          enum: [ICON, INITIALS, PICTURE]
          description: >-
            Counsellor avatar choice (#1046). Null leaves the stored choice untouched. Unlike the
            free-text personal-info fields this is a typed enum, so it carries no empty-string
            clear: send INITIALS to drop an icon choice.
        avatarId:
          type: string
          maxLength: 64
          example: "motif-24"
          description: >-
            Id of the chosen counsellor motif, only meaningful with avatarKind = ICON. Null
            leaves the stored value untouched; an empty string clears it — which also demotes a
            stored ICON choice to INITIALS, because a half choice is never persisted.
        topicPermission:
          $ref: '#/components/schemas/TopicPermissionDTO'

    TopicPermissionDTO:
      type: string
      enum: [NONE, SELECT_EXISTING, CREATE]
      description: >-
        How far a counsellor may extend their own topics (ORISO-Admin#1026). NONE = only the
        assigned department, SELECT_EXISTING = pick among the agency's departments, CREATE =
        add further topics of the Traeger (today's behaviour). On an update, null leaves the
        stored value untouched.

