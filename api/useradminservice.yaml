            format: int64
      responses:
        200:
          description: OK - admin-agency relation was deleted successfully
        400:
          description: BAD REQUEST - invalid/incomplete request
        401:
          description: UNAUTHORIZED - no/invalid role/authorization
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: [ ]

  /useradmin/tenantadmins:
      get:
        tags:
          - admin-user-controller
        summary: 'Returns the list of tenant admins by filter query parameter. [Authorization: Role: user-admin]'
        operationId: getTenantAdmins
        parameters:
          - name: tenantId
            in: query
            description: tenant id
            required: true
            schema:
              type: integer
        responses:
          200:
            description: OK - successful operation
            content:
              'application/json':
                schema:
                  type: array
                  items:
