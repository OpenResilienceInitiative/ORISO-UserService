      type: string
      x-internal: true
      enum: [PREPARED, INVITED, ACCOUNT_CREATED, DONE, NEEDS_ACTION, CLOSED]
      description: >-
        The Admin's status tiles, derived in one place (InviteProgress). PREPARED = draft or
        waiting (Vorbereitet); INVITED = mail sent, link valid (Eingeladen); ACCOUNT_CREATED = a
        gate is open (Konto angelegt); DONE = all gates passed (Fertig); NEEDS_ACTION = bounced,
        expired, provisioning failed or no admin for its new unit (Braucht Aktion); CLOSED =
        revoked or replaced, no tile.
    AccountInviteTargetRole:
      type: string
      x-internal: true
      enum: [TENANT_ADMIN, AGENCY_ADMIN, COUNSELLOR, ADVICE_SEEKER, PLATFORM_ADMIN]
    AccountInviteStatus:
      type: string
      x-internal: true
      enum: [WAITING_FOR_UNIT, DRAFT, EMAIL_SENT, ACCEPTED, EXPIRED, REVOKED, SUPERSEDED]
    IdAllocationMode:
      type: string
      x-internal: true
      enum: [AUTO, MANUAL, EXISTING]
      description: AUTO/MANUAL reserve a new ID; EXISTING names a unit that exists (nothing is reserved).
    TopicPermissionInput:
      x-internal: true
      description: >-
        NONE, SELECT_EXISTING or CREATE (case-insensitive); the CSV import may send true (= CREATE)
        or false (= NONE). Omitted on create (e.g. a CSV row without that column) = SELECT_EXISTING,
        whatever the agency default says; an explicit value always wins; agency admins always get
        CREATE.
      oneOf:
        - $ref: '#/components/schemas/TopicPermissionDTO'
        - type: boolean
    SelfAssignmentRequest:
      type: object
      x-internal: true
      required: [role, agencyId]
      properties:
        role:
          type: string
          enum: [COUNSELLOR]
        agencyId:
          type: integer
          format: int64
        topicIds:
          type: array
          items:
            type: integer
            format: int64
          description: Omitted = the agency's only topic; required when it offers several.
    SelfAssignment:
      type: object
      x-internal: true
      properties:
        role:
          type: string
          enum: [COUNSELLOR]
        agencyId:
          type: integer
          format: int64
        userId:
          type: string
        consultantIdentityCreated:
          type: boolean

  parameters:
    InviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    AccountInviteConflict:
      description: >-
        CONFLICT. X-Reason names the case; a 409 without it is a Träger or agency number that is
        already taken or already exists (use EXISTING).
      headers:
        X-Reason:
          schema:
            type: string
            enum:
              - EMAIL_NOT_AVAILABLE
              - NO_PENDING_UNIT_ADMIN
              - UNIT_NOT_CREATED
              - SELF_ASSIGNMENT_ALREADY_EXISTS
              - CONSULTANT_IDENTITY_ALREADY_GRANTED
              - INVITE_ALREADY_ACCEPTED
              - INVITE_NOT_PENDING
              - ROLE_CHANGE_NEEDS_NEW_INVITE
              - ONLY_UNIT_ADMIN
              - ROLE_ALREADY_GRANTED
          description: >-
            EMAIL_NOT_AVAILABLE - the address has an account or an open invite;
            NO_PENDING_UNIT_ADMIN - a waiting invite needs a pending admin invite for its new unit;
            UNIT_NOT_CREATED - a waiting invite cannot be sent before its unit exists;
            SELF_ASSIGNMENT_ALREADY_EXISTS / CONSULTANT_IDENTITY_ALREADY_GRANTED - the admin
            already counsels in that agency;
            INVITE_ALREADY_ACCEPTED - the account exists, add a role to the account instead;
            INVITE_NOT_PENDING - the invite was revoked, replaced or has expired;
            ROLE_CHANGE_NEEDS_NEW_INVITE - a TENANT_ADMIN (or other non-agency) role cannot be
            swapped in, it has another placement and link: revoke and invite anew;
            ONLY_UNIT_ADMIN - the invite is the only pending admin of its new agency, so
            counsellors would wait for nobody: invite another admin first;
            ROLE_ALREADY_GRANTED - the account already administers that agency, or is a Träger
            or platform admin.

  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
