  # Account invites and self-assignment are served by hand-written controllers
  # (AccountInviteController, AdminSelfAssignmentController). x-internal keeps the generator from
  # adding them to UseradminApi, whose implementation would then map the same routes twice.
  /useradmin/account-invites:
    post:
      x-internal: true
      tags:
        - account-invite-controller
      summary: 'Creates an account invite, and sends it when templateId is set [Authorization: tenant-admin, user-admin, restricted-agency-admin]'
      description: >-
        An invite into a Träger or Beratungsstelle that does not exist yet (COUNSELLOR with a
        new agency, AGENCY_ADMIN with a new Träger) is stored as WAITING_FOR_UNIT and not sent;
        it needs a pending admin invite for the same new unit and goes out once that admin has
        onboarded.
      operationId: createAccountInvite
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountInviteRequest'
      responses:
        201:
          description: CREATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInvite'
        400:
          description: BAD REQUEST - invalid field combination, unknown enum value, or a topic permission that leaves the counsellor without any topic
        403:
          description: FORBIDDEN - role, Träger or agency outside the caller's scope
        404:
          description: NOT FOUND - an EXISTING Träger or agency that does not exist (or is deleted)
        409:
          $ref: '#/components/responses/AccountInviteConflict'
        502:
          description: BAD GATEWAY - SMTP failed; the invite is kept only when delivery is uncertain
      security:
        - Bearer: [ ]
    get:
      x-internal: true
      tags:
        - account-invite-controller
      summary: 'Lists the account invites in the caller''s scope [Authorization: tenant-admin, user-admin, restricted-agency-admin]'
      operationId: listAccountInvites
      parameters:
        - name: tab
          in: query
          description: >-
            The Admin's tab. TENANT = Träger admins who found a new Träger; UNIT = everyone joining
            a unit. The list and phaseCounts both cover only this tab.
          schema:
            type: string
            enum: [TENANT, UNIT]
        - name: target_role
          in: query
          schema:
            $ref: '#/components/schemas/AccountInviteTargetRole'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AccountInviteStatus'
        - name: progress_phase
          in: query
          description: One status tile; phaseCounts in the answer ignore this and status.
          schema:
            $ref: '#/components/schemas/AccountInviteProgressPhase'
        - name: tenant_id
          in: query
          schema:
            type: integer
            format: int64
        - name: query
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedAccountInvites'
        400:
          description: BAD REQUEST - unknown filter value
        403:
          description: FORBIDDEN - another tenant was requested
      security:
        - Bearer: [ ]
  /useradmin/account-invites/{inviteId}/send:
    post:
      x-internal: true
      tags:
        - account-invite-controller
      summary: 'Sends a stored invite; for a WAITING_FOR_UNIT invite this is its release [Authorization: tenant-admin, user-admin, restricted-agency-admin]'
      operationId: sendAccountInvite
      parameters:
        - $ref: '#/components/parameters/InviteId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendAccountInviteRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInvite'
        400:
          description: BAD REQUEST - accepted, revoked or superseded invite
        403:
          description: FORBIDDEN - invite outside the caller's scope
        404:
          description: NOT FOUND - invite or template unknown
        409:
          $ref: '#/components/responses/AccountInviteConflict'
        502:
          description: BAD GATEWAY - SMTP failed
      security:
        - Bearer: [ ]
  /useradmin/account-invites/{inviteId}/resend:
    post:
      x-internal: true
      tags:
        - account-invite-controller
      summary: 'Replaces the invite link and sends it again [Authorization: tenant-admin, user-admin, restricted-agency-admin]'
      operationId: resendAccountInvite
      parameters:
        - $ref: '#/components/parameters/InviteId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendAccountInviteRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInvite'
        400:
          description: BAD REQUEST - accepted or revoked invite
        403:
          description: FORBIDDEN - invite outside the caller's scope
        409:
          $ref: '#/components/responses/AccountInviteConflict'
        502:
          description: BAD GATEWAY - SMTP failed
      security:
        - Bearer: [ ]
  /useradmin/account-invites/{inviteId}/revoke:
    post:
      x-internal: true
      tags:
        - account-invite-controller
      summary: 'Revokes an invite and gives back a Träger or agency number no other invite needs; 409 INVITE_ALREADY_ACCEPTED once its account exists [Authorization: tenant-admin, user-admin, restricted-agency-admin]'
      operationId: revokeAccountInvite
      parameters:
        - $ref: '#/components/parameters/InviteId'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInvite'
        403:
          description: FORBIDDEN - invite outside the caller's scope
        409:
          $ref: '#/components/responses/AccountInviteConflict'
      security:
        - Bearer: [ ]
  /useradmin/account-invites/{inviteId}/topic-permission:
    put:
      x-internal: true
      tags:
        - account-invite-controller
      summary: 'Sets an invited counsellor''s topic permission; after onboarding it changes the counsellor''s own value [Authorization: tenant-admin, user-admin, restricted-agency-admin]'
      operationId: updateAccountInviteTopicPermission
      parameters:
        - $ref: '#/components/parameters/InviteId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-internal: true
              properties:
                topicPermission:
                  $ref: '#/components/schemas/TopicPermissionInput'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInvite'
        400:
          description: BAD REQUEST - missing or unknown value, a non-counsellor invite, or no topic left to pick
        403:
          description: FORBIDDEN - invite outside the caller's scope
        404:
          description: NOT FOUND - invite unknown
      security:
        - Bearer: [ ]
  /useradmin/account-invites/{inviteId}/role:
    put:
      x-internal: true
      tags:
        - account-invite-controller
      summary: 'Changes the role of an invite nobody has accepted yet [Authorization: tenant-admin, user-admin, restricted-agency-admin]'
      description: >-
        WAITING_FOR_UNIT, DRAFT and EMAIL_SENT invites only. COUNSELLOR and AGENCY_ADMIN swap
        (both use the same onboarding link, so a sent link stays valid); the caller may only set
        a role they could invite ("higher invites lower"). A promoted counsellor gets
        alsoCounsellor true unless the request says false; a demoted admin loses it. An invite
        that now has to wait for its new agency moves to WAITING_FOR_UNIT (its sent link stops
        working and the last template goes out on release); a waiting counsellor who becomes an
        admin of the new agency leaves the queue as a DRAFT sharing that agency's reservation.
        An accepted invite is not changed here: use POST /useradmin/consultants/{consultantId}/roles.
      operationId: changeAccountInviteRole
      parameters:
        - $ref: '#/components/parameters/InviteId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-internal: true
              required: [targetRole]
              properties:
                targetRole:
                  $ref: '#/components/schemas/AccountInviteTargetRole'
                alsoCounsellor:
                  type: boolean
                  description: AGENCY_ADMIN only (400 otherwise); omitted keeps it, or true on promotion.
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInvite'
        400:
          description: BAD REQUEST - missing or unknown role, alsoCounsellor for a non-admin role, or no topic left to pick
        403:
          description: FORBIDDEN - invite outside the caller's scope (other Träger or agency), or a role the caller could not invite
        404:
          description: NOT FOUND - invite unknown
        409:
          $ref: '#/components/responses/AccountInviteConflict'
      security:
        - Bearer: [ ]
  /useradmin/consultants/{consultantId}/roles:
    post:
      x-internal: true
      tags:
        - consultant-role-controller
      summary: 'Adds a role to an existing counsellor account; only AGENCY_ADMIN [Authorization: tenant-admin, user-admin]'
      description: >-
        Makes the counsellor Beratungsstellen-Admin of one agency they counsel in: the admin row,
        its admin_agency relation and the Keycloak roles restricted-agency-admin and user-admin,
        in that order inside one transaction (a refused Keycloak role leaves no rows). Removing a
        role stays in the Users area.
      operationId: addConsultantRole
      parameters:
        - name: consultantId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-internal: true
              required: [role]
              properties:
                role:
                  type: string
                  enum: [AGENCY_ADMIN]
                agencyId:
                  type: integer
                  format: int64
                  description: Omitted = the counsellor's only agency.
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                x-internal: true
                properties:
                  consultantId:
                    type: string
                  role:
                    type: string
                    enum: [AGENCY_ADMIN]
                  agencyIds:
                    type: array
                    description: Every agency the account administers now.
                    items:
                      type: integer
                      format: int64
        400:
          description: BAD REQUEST - missing or other role, or an agency the counsellor does not counsel in
        403:
          description: FORBIDDEN - counsellor outside the caller's scope (other Träger), or a caller who may not invite agency admins (Beratungsstellen-Admins)
        404:
          description: NOT FOUND - counsellor unknown or marked for deletion
        409:
          $ref: '#/components/responses/AccountInviteConflict'
      security:
        - Bearer: [ ]
  /useradmin/account-invites/{inviteId}/waive-two-factor:
    post:
      x-internal: true
      tags:
        - account-invite-controller
      summary: 'Waives the mandatory 2FA setup of an invite [Authorization: tenant-admin, user-admin, restricted-agency-admin]'
      operationId: waiveAccountInviteTwoFactor
      parameters:
        - $ref: '#/components/parameters/InviteId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-internal: true
              properties:
                reason:
                  type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInvite'
        400:
          description: BAD REQUEST - reason missing
        403:
          description: FORBIDDEN - invite outside the caller's scope
      security:
        - Bearer: [ ]
  /useradmin/self-assignments:
    post:
      x-internal: true
      tags:
        - admin-self-assignment-controller
      summary: 'Adds the calling admin''s own account as counsellor of an agency; no e-mail [Authorization: tenant-admin, user-admin, restricted-agency-admin]'
      operationId: assignSelf
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelfAssignmentRequest'
      responses:
        201:
          description: CREATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfAssignment'
        400:
          description: BAD REQUEST - unknown role (AGENCY_ADMIN is not offered), missing agency, or no topic to counsel in
        403:
          description: FORBIDDEN - agency outside the caller's scope
        404:
          description: NOT FOUND - agency unknown or deleted
        409:
          $ref: '#/components/responses/AccountInviteConflict'
      security:
        - Bearer: [ ]
    get:
      x-internal: true
      tags:
        - admin-self-assignment-controller
      summary: 'The agencies the caller administers and counsels in [Authorization: tenant-admin, user-admin, restricted-agency-admin]'
      operationId: getSelfAssignments
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                x-internal: true
                properties:
                  agencyAdminAgencyIds:
                    type: array
                    items:
                      type: integer
                      format: int64
                  counsellorAgencyIds:
                    type: array
                    items:
                      type: integer
                      format: int64
      security:
        - Bearer: [ ]
components:
  schemas:
    RootDTO:
      type: object
      required:
        - _links
      properties:
        _links:
          $ref: '#/components/schemas/RootLinks'

    RootLinks:
      type: object
      required:
        - self
      properties:
        self:
          $ref: '#/components/schemas/HalLink'
        sessions:
          $ref: '#/components/schemas/HalLink'
        consultantAgencies:
          $ref: '#/components/schemas/HalLink'
        consultants:
          $ref: '#/components/schemas/HalLink'
        createConsultant:
          $ref: '#/components/schemas/HalLink'
        deleteAsker:
          $ref: '#/components/schemas/HalLink'

    HalLink:
      type: object
      required:
        - href
      properties:
        href:
          type: string
        method:
          type: string
          enum: [ GET, POST, DELETE, PUT ]
        templated:
          type: boolean

    SessionAdminResultDTO:
      type: object
      properties:
        _embedded:
          type: array
          items:
            $ref: '#/components/schemas/SessionAdminDTO'
        _links:
          $ref: '#/components/schemas/PaginationLinks'
        total:
          type: integer

    SessionAdminDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 94
        userId:
          type: string
          example: "1da238c6-cd46-4162-80f1-bff74eafe77f"
        consultantId:
          type: string
          example: "1da238c6-cd46-4162-80f1-bff74eafe77f"
        username:
          type: string
          example: "enc.OBSXEZTPOJWWC3TDMUWWC43LMVZC2NZS"
        email:
          type: string
          example: "email@beratungcaritas.de"
        consultingType:
          type: integer
          example: 1
        postcode:
          type: string
          example: "12345"
        agencyId:
          type: integer
          example: 1
        isTeamSession:
          type: boolean
        messageDate:
          type: string
        createDate:
          type: string
        updateDate:
          type: string

    PaginationLinks:
      type: object
      required:
        - self
      properties:
        self:
          $ref: '#/components/schemas/HalLink'
        next:
          $ref: '#/components/schemas/HalLink'
        previous:
          $ref: '#/components/schemas/HalLink'

    CreateConsultantDTO:
      type: object
      required:
        - username
        - password
        - firstname
        - lastname
        - email
        - formalLanguage
        - absent
      properties:
        username:
          type: string
          example: "max.mustermann"
          minLength: 1
          maxLength: 255
        password:
          type: string
          format: password
          example: "SecurePass123!"
          description: "Password for the consultant"
          minLength: 8
          maxLength: 255
        firstname:
          type: string
          example: "Max"
          minLength: 1
          maxLength: 255
        lastname:
          type: string
          example: "Mustermann"
          minLength: 1
          maxLength: 255
        email:
          type: string
          example: "max@mustermann.de"
          minLength: 1
          maxLength: 255
        formalLanguage:
          type: boolean
          example: true
        absent:
          type: boolean
          example: true
        absenceMessage:
          type: string
          example: "I am absent until..."
          minLength: 1
          maxLength: 10000
        tenantId:
          type: integer
          format: int64
          example: "1"
        isGroupchatConsultant:
          $ref: '#/components/schemas/IsGroupchatConsultant'
        topicIds:
          type: array
          description: ids of topics directly assigned to the consultant
          items:
            type: integer
            format: int64
          example: [3, 7, 12]
        agencyIds:
          type: array
          description: ids of agencies assigned atomically with the consultant
          items:
            type: integer
            format: int64
          example: [5, 9]
        publicSlug:
          type: string
          example: nikunj-rohit
          description: Optional public slug. Admin-created values go live immediately.
        displayName:
          type: string
          maxLength: 255
          description: Optional PUBLIC display name shown to advice seekers.
        internalDisplayName:
          type: string
          maxLength: 255
          description: >-
            Optional internal display name for internal surfaces; internal contexts fall back to
            the public displayName when empty.
        salutation:
          type: string
          maxLength: 64
          example: counsellor_female
          description: Stable salutation key chosen from the admin form option list.
        position:
          type: string
          maxLength: 255
          example: "Head of counselling centre north"
        title:
          type: string
          maxLength: 255
          example: "Dipl.-Soz.Päd."
        adminRemarks:
          type: string
          maxLength: 10000
          description: >-
            Internal remarks about the consultant. Only readable and writable for tenant-level
            admins (tenant admin / platform admin); ignored for other callers.
        avatarKind:
          type: string
          enum: [ICON, INITIALS, PICTURE]
          description: >-
            Counsellor avatar choice (#1046): ICON = one of the platform's monochrome counsellor
            motifs (then avatarId carries the motif id), INITIALS = the generated initials tile,
            PICTURE = an own uploaded picture. The upload itself is a separate ticket
            (#1048/#1049) and is not served by this service yet. Omitted means no choice; the
            initials fallback is rendered.
        avatarId:
          type: string
          maxLength: 64
          example: "motif-24"
          description: >-
            Id of the chosen counsellor motif. Only meaningful together with avatarKind = ICON;
            it is dropped for every other kind, and an ICON without a motif id is stored as
            INITIALS — a half choice is never persisted.

    IsGroupchatConsultant:
      type: boolean
      example: true

    IsSupervisor:
      type: boolean
      example: true
      description: Flag that indicates if the consultant can be added as a supervisor

    AssignedSupervisorId:
      type: string
      maxLength: 36
      example: 8bb2b0a4-2c5b-4f5a-9c3a-1d2e3f4a5b6c
      description: >-
        Supervision (auto-assigned): the consultant id of this counsellor's standing supervisor,
        who is automatically attached read-only to every case the counsellor accepts. At most one;
        the target must itself have isSupervisor = true and may not be the counsellor themselves.
        Omitted/null leaves the current assignment untouched; an empty string clears it (clearing
        stops future auto-attachment and does not detach supervisors already on in-flight cases).

    UpdateAdminConsultantDTO:
      type: object
      required:
        - firstname
        - lastname
        - email
        - formalLanguage
        - absent
      properties:
        firstname:
          type: string
          example: "Max"
          minLength: 1
          maxLength: 255
        lastname:
          type: string
          example: "Mustermann"
          minLength: 1
          maxLength: 255
