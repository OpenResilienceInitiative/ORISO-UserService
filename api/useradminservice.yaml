openapi: 3.0.1
info:
  title: will be replaced
  description: This information will be replaced by the SpringFox config information
  version: 0.0.1
externalDocs:
  description: Internal consultant picture API (bounded raw-byte intake, maintained separately from generated JSON controllers).
  url: ./useradmin-consultant-picture.yaml
paths:
  /useradmin:
    get:
      tags:
        - root-controller
      summary: 'Returns the hal root entry point. [Authorization: Role: user-admin]'
      operationId: getRoot
      responses:
        200:
          description: OK - successfull operation
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/RootDTO'
      security:
        - Bearer: [ ]
  /useradmin/sessions:
    get:
      tags:
        - admin-user-controller
      summary: >-
        Returns the list of sessions by filter query parameter. [Authorization: Role:
        user-admin]
      operationId: getSessions
      parameters:
        - name: filter
          in: query
          description: >-
            The filter parameters to search for. If no filter is set all sessions are
            being returned. If more than one filter is set the first given filter is used only.
          schema:
            $ref: '#/components/schemas/SessionFilter'
        - name: page
          in: query
          description: Number of page where to start in the query (1 = first page)
          required: true
          schema:
            type: integer
        - name: perPage
          in: query
          description: Number of items which are being returned per page
          required: true
          schema:
            type: integer
      responses:
        200:
          description: OK - successfull operation
          content:
            'application/hal+json':
              schema:
                $ref: '#/components/schemas/SessionAdminResultDTO'
        400:
          description: BAD REQUEST - invalid/incomplete request or body object
        401:
          description: UNAUTHORIZED - no/invalid role/authorization
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: [ ]
  /useradmin/consultants:
    get:
      tags:
        - admin-user-controller
      summary: 'Returns the list of consultants by filter query parameter. [Authorization: Role: consultant-admin]'
      operationId: getConsultants
      parameters:
        - name: filter
          in: query
          description: >-
            The filter parameters to search for. If no filter is set all consultant are
            being returned.
          schema:
            $ref: '#/components/schemas/ConsultantFilter'
        - name: page
          in: query
          description: Number of page where to start in the query (1 = first page)
          required: true
          schema:
            type: integer
        - name: perPage
          in: query
          description: Number of items which are being returned per page
          required: true
          schema:
            type: integer
        - name: sort
          in: query
          description: The sort parameter containing field and order the response should be sorted
          schema:
            $ref: '#/components/schemas/Sort'
      responses:
        200:
          description: OK - successfull operation
          content:
            'application/hal+json':
              schema:
                $ref: '#/components/schemas/ConsultantSearchResultDTO'
        400:
          description: BAD REQUEST - invalid/incomplete request or body object
        401:
          description: UNAUTHORIZED - no/invalid role/authorization
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: [ ]
    post:
      tags:
        - admin-user-controller
      summary: 'Creates a new consultant [Authorization: Role: consultant-admin]'
      operationId: createConsultant
      requestBody:
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/CreateConsultantDTO'
        required: true
      responses:
        201:
          description: CREATED - consultant was created successfully
          content:
            'application/hal+json':
              schema:
                $ref: '#/components/schemas/ConsultantAdminResponseDTO'
        400:
          description: BAD REQUEST - invalid/incomplete request or body object
        401:
          description: UNAUTHORIZED - no/invalid role/authorization
        409:
          description: CONFLICT - invalid/unavailable username or email address
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: [ ]
  /useradmin/consultants/{consultantId}:
    get:
      tags:
        - admin-user-controller
      summary: 'Get a consultant by given id [Authorization: Role: consultant-admin]'
      operationId: getConsultant
      parameters:
        - name: consultantId
          in: path
          description: consultant id
          required: true
          schema:
            type: string
      responses:
        200:
          description: OK - consultant found
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/ConsultantAdminResponseDTO'
        204:
          description: NO CONTENT - consultant with the specific id was not found
        400:
          description: BAD REQUEST - invalid/incomplete request
        401:
          description: UNAUTHORIZED - no/invalid role/authorization
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: [ ]
    put:
      tags:
        - admin-user-controller
      summary: 'Updates a consultant [Authorization: Role: consultant-admin]'
      operationId: updateConsultant
      requestBody:
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/UpdateAdminConsultantDTO'
        required: true
      parameters:
        - name: consultantId
          in: path
          description: consultant id
          required: true
          schema:
            type: string
      responses:
        200:
          description: OK - consultant was updated successfully
          content:
            'application/hal+json':
              schema:
                $ref: '#/components/schemas/ConsultantAdminResponseDTO'
        400:
          description: BAD REQUEST - invalid/incomplete request
        401:
          description: UNAUTHORIZED - no/invalid role/authorization
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: [ ]
    delete:
      tags:
        - admin-user-controller
      summary: 'Mark a consultant for deletion [Authorization: Role: consultant-admin]'
      operationId: markConsultantForDeletion
      parameters:
        - name: consultantId
          in: path
          description: consultant id
          required: true
          schema:
            type: string
        - name: forceDeleteSessions
          in: query
          schema:
            type: boolean
          description: parameter specifying if consultant sessions need to be removed prior the deletion
      responses:
        200:
          description: OK - consultant was marked for deletion successfully
        400:
          description: BAD REQUEST - invalid/incomplete request
        401:
          description: UNAUTHORIZED - no/invalid role/authorization
        404:
          description: NOT FOUND - consultant not found
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: [ ]
  /useradmin/consultants/{consultantId}/chat-identity:
    post:
      tags:
        - admin-user-controller
      summary: >-
        Completes the chat (Matrix) provisioning of an existing consultant
        [Authorization: Role: consultant-admin]
      description: >-
        Idempotent repair for a consultant whose chatIdentityStatus is MISSING, i.e. one that was
        created while the chat server was unreachable. Provisions the missing chat identity and
        stores it on the consultant. Calling it for a consultant that already has a chat identity
        changes nothing and answers 200 with chatIdentityStatus = PROVISIONED, so the call is safe
        to repeat.
      operationId: repairConsultantChatIdentity
      parameters:
        - name: consultantId
          in: path
          description: consultant id
          required: true
          schema:
            type: string
      responses:
        200:
          description: >-
            OK - the consultant owns a chat identity, either because this call provisioned one or
            because it already had one
          content:
            'application/hal+json':
              schema:
                $ref: '#/components/schemas/ConsultantAdminResponseDTO'
        400:
          description: BAD REQUEST - invalid/incomplete request
        401:
          description: UNAUTHORIZED - no/invalid role/authorization
        404:
          description: NOT FOUND - consultant not found
        409:
          description: >-
            CONFLICT - the chat account behind this consultant's username is already held by
            another consultant; it cannot be adopted and the collision has to be resolved first
        424:
          description: >-
            FAILED DEPENDENCY - the chat server could not provision the account; the consultant is
            unchanged and the call can be repeated
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: [ ]
  /useradmin/askers/{askerId}:
    get:
      tags:
        - admin-user-controller
      summary: 'Get an asker by given id [Authorization: Role: consultant-admin]'
      operationId: getAsker
      parameters:
        - name: askerId
          in: path
          description: asker id
          required: true
          schema:
            type: string
      responses:
        200:
          description: OK - asker found
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/AskerResponseDTO'
        204:
          description: NO CONTENT - asker with the specific id was not found
        400:
          description: BAD REQUEST - invalid/incomplete request
        401:
          description: UNAUTHORIZED - no/invalid role/authorization
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: [ ]
    delete:
      tags:
        - admin-user-controller
      summary: 'Delete a asker by given id [Authorization: Role: consultant-admin]'
      operationId: markAskerForDeletion
      parameters:
        - name: askerId
          in: path
          description: asker id
          required: true
          schema:
            type: string
      responses:
        200:
          description: OK - asker was marked for deletion successfully
        400:
          description: BAD REQUEST - invalid/incomplete request
        401:
          description: UNAUTHORIZED - no/invalid role/authorization
        404:
          description: NOT FOUND - asker not found
        409:
          description: CONFLICT - asker is already marked for deletion
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: [ ]
  /useradmin/report:
    get:
      tags:
        - admin-user-controller
      summary: 'Returns an generated report containing data integration violations. [Authorization: Role: user-admin]'
      operationId: generateViolationReport
      responses:
        200:
          description: OK - successfull operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ViolationDTO'
        401:
          description: UNAUTHORIZED - no/invalid role/authorization
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: [ ]
  /useradmin/agencies/{agencyId}/consultants:
    get:
      tags:
        - admin-user-controller
      summary: >-
        Returns the list of consultants for a given agency Id. [Authorization: Role:
        user-admin]
      operationId: getAgencyConsultants
      parameters:
