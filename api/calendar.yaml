openapi: 3.0.1
info:
  title: will be replaced
  description: This information will be replaced by the SpringFox config information
  version: 0.0.1
paths:
  /users/calendar/entries:
    get:
      tags:
        - calendar-controller
      summary: 'The caller''s own calendar in a window of at most 62 days. A counsellor gets the
        scheduled 1:1 appointments of their own and co-access sessions, the occurrences of the
        group chats they own or take part in, their blockers and their imported busy times. An
        asker gets their own appointments and the occurrences of the group chats they joined,
        read-only. [Authorization: counsellor or asker]'
      operationId: getCalendarEntries
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarEntryDTO'
        400:
          description: BAD REQUEST - from not before to, or a window of more than 62 days
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - no/invalid role/authorization
      security:
        - Bearer: [ ]
  /users/calendar/colleagues:
    get:
      tags:
        - calendar-controller
      summary: 'The colleagues whose calendar the caller may look at, as the Träger setting
        calendar.visibilityScope allows; without the caller, sorted by name, at most 200.
        [Authorization: counsellor]'
      operationId: getCalendarColleagues
      parameters:
        - name: search
          in: query
          description: Case-insensitive part of the display name
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarColleaguesDTO'
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - no/invalid role/authorization
      security:
        - Bearer: [ ]
  /users/calendar/colleagues/{consultantId}/entries:
    get:
      tags:
        - calendar-controller
      summary: 'The redacted calendar of one colleague in a window of at most 62 days: times,
        type and kind only; the asker''s username only where the Träger shows it. Imported busy
        times read as blockers. [Authorization: counsellor with the colleague in scope]'
      operationId: getCalendarColleagueEntries
      parameters:
        - name: consultantId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarEntryDTO'
        400:
          description: BAD REQUEST - from not before to, or a window of more than 62 days
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - no/invalid role/authorization
        404:
          description: NOT FOUND - no such colleague, or not within the caller's scope
      security:
        - Bearer: [ ]
  /users/calendar/blockers:
    post:
      tags:
        - calendar-controller
      summary: 'Blocks time in the caller''s calendar. A repeat is expanded on the server into
        single blockers of one series, at most 120. [Authorization: counsellor]'
      operationId: createCalendarBlockers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockerCreateDTO'
      responses:
        201:
          description: CREATED
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarEntryDTO'
        400:
          description: BAD REQUEST - end not after start, start more than a day ago, an invalid
            repeat, or more than 120 blockers
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - no/invalid role/authorization or CSRF token
      security:
        - Bearer: [ ]
  /users/calendar/blockers/{blockerId}:
    put:
      tags:
        - calendar-controller
      summary: 'Moves one blocker of the caller. [Authorization: counsellor who owns it]'
      operationId: moveCalendarBlocker
      parameters:
        - $ref: '#/components/parameters/BlockerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockerTimeDTO'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEntryDTO'
        400:
          description: BAD REQUEST - end not after start, or start more than a day ago
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - no/invalid role/authorization or CSRF token
        404:
          description: NOT FOUND - no such blocker of the caller
      security:
        - Bearer: [ ]
    delete:
      tags:
        - calendar-controller
      summary: 'Removes one blocker of the caller. [Authorization: counsellor who owns it]'
      operationId: deleteCalendarBlocker
      parameters:
        - $ref: '#/components/parameters/BlockerId'
      responses:
        204:
          description: NO CONTENT
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - no/invalid role/authorization or CSRF token
        404:
          description: NOT FOUND - no such blocker of the caller
      security:
        - Bearer: [ ]
components:
  parameters:
    From:
      name: from
      in: query
      description: Start of the window (inclusive), ISO-8601
      required: true
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: End of the window (exclusive), ISO-8601, at most 62 days after from
      required: true
      schema:
        type: string
        format: date-time
    BlockerId:
      name: blockerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CalendarEntryType:
      type: string
      enum:
        - APPOINTMENT
        - GROUP
        - BLOCKER
        - BUSY
    AppointmentKind:
      description: How the appointment takes place. Absent on appointments made before the kind
        existed; a reschedule without a kind keeps the stored one.
      type: string
      enum:
        - ONSITE
        - VIDEO
        - PHONE
        - CHAT
    CalendarEntryDTO:
      type: object
      required:
        - id
        - type
        - start
        - end
        - ownerId
        - movable
      properties:
        id:
          description: Appointment id, "chat-{chatId}-{occurrenceIndex}" or blocker id
          type: string
        type:
          $ref: '#/components/schemas/CalendarEntryType'
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        ownerId:
          description: The counsellor whose calendar this is; in an asker's view the asker
          type: string
        kind:
          $ref: '#/components/schemas/AppointmentKind'
        title:
          description: Own view - asker username, group topic or blocker note. Asker view -
            the counsellor's display name. Colleague view - the asker username where the Träger
            shows it, else absent.
          type: string
        sessionId:
          description: Own and asker view only
          type: integer
          format: int64
        seriesId:
          description: Blockers created as a series
          type: string
        movable:
          type: boolean
    CalendarColleagueDTO:
      type: object
      required:
        - id
        - displayName
        - agencyName
        - relation
      properties:
        id:
          type: string
        displayName:
          type: string
        agencyName:
          type: string
        relation:
          type: string
          enum:
            - SAME_AGENCY
            - SAME_TENANT
            - OTHER_TENANT
    CalendarColleaguesDTO:
      type: object
      required:
        - visibilityScope
        - showAskerUsernames
        - colleagues
      properties:
        visibilityScope:
          type: string
          enum:
            - AGENCY
            - TENANT
            - PLATFORM
        showAskerUsernames:
          type: boolean
        colleagues:
          type: array
          items:
            $ref: '#/components/schemas/CalendarColleagueDTO'
    BlockerRepeatDTO:
      type: object
      required:
        - weekdays
        - until
      properties:
        weekdays:
          description: 0 = Sunday .. 6 = Saturday
          type: array
          items:
            type: integer
            format: int32
        until:
          description: Last day of the series (inclusive)
          type: string
          format: date
    BlockerCreateDTO:
      type: object
      required:
        - start
        - end
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        allDay:
          type: boolean
        note:
          type: string
          maxLength: 255
        repeat:
          $ref: '#/components/schemas/BlockerRepeatDTO'
    BlockerTimeDTO:
      type: object
      required:
        - start
        - end
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
